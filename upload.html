<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌单更新</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
    }
    body {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background-color: #f5f7fa;
    }
    /* 滚动条（Firefox）：写在 body，紫色滑块，浅色页面适配半透明浅灰轨道（对齐 danmaku-viewer 写法，窗口滚动条走 ::-webkit-scrollbar 避免箭头） */
    body {
        scrollbar-width: thin;
        scrollbar-color: #b388ff rgba(0, 0, 0, 0.08);
    }
    /* 全局滚动条（Chrome / Edge / Safari）：与主页 index.html 统一紫色 */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.08);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
        background: #b388ff;
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #a78bfa;
    }
    ::-webkit-scrollbar-corner {
        background: transparent;
    }
    /* 隐藏滚动条上下箭头（窗口及其余滚动区域，兼容封装浏览器默认渲染箭头） */
    ::-webkit-scrollbar-button {
        display: none;
        width: 0;
        height: 0;
    }

    .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h2 {
        text-align: center;
        color: #222;
        margin-bottom: 28px;
        font-size: 26px;
    }
    .item-box {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
    }
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        font-size: 14px;
    }
    .btn {
        padding: 12px 22px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: opacity 0.2s;
    }
    .btn:hover {
        opacity: 0.9;
    }
    .btn-upload {
        background: #409eff;
        color: white;
        margin-right: 12px;
    }
    .btn-import {
        background: #e6a23c;
        color: white;
        margin-right: 12px;
    }
    .btn-push {
        background: #67c23a;
        color: white;
    }
    .btn:disabled {
        background: #c0c4cc;
        cursor: not-allowed;
        opacity: 0.7;
    }
    /* 导入方式二选一 switch */
    .mode-switch {
        display: flex;
        margin-bottom: 20px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        overflow: hidden;
    }
    .mode-btn {
        flex: 1;
        padding: 11px 0;
        border: none;
        background: #f5f7fa;
        color: #666;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
    }
    .mode-btn + .mode-btn {
        border-left: 1px solid #dcdfe6;
    }
    .mode-btn.active {
        background: #409eff;
        color: #fff;
    }
    #jsonInput {
        width: 100%;
        height: 220px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        padding: 12px;
        resize: vertical;
        background: #fafafa;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
    }
    #jsonBox {
        width: 100%;
        height: 360px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        padding: 12px;
        overflow-y: auto;
        resize: none;
        background: #fafafa;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
        /* 重置 body 继承的标准滚动条属性，强制走 ::-webkit-scrollbar 自定义路径（避免封装浏览器标准模式渲染箭头） */
        scrollbar-width: auto;
        scrollbar-color: auto;
    }
    .btn-group {
        margin: 20px 0;
    }
    .tip {
        font-size: 13px;
        color: #666;
        margin-top: 6px;
        line-height: 1.5;
    }
    .step-desc {
        background: #eef7ff;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 24px;
        line-height: 1.6;
        color: #224;
    }
    /* Toast弹窗样式 */
    .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #303133;
        color: #fff;
        border-radius: 6px;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
    }
    .toast.show {
        opacity: 1;
    }
    .toast.success {
        background: #67c23a;
    }
    .toast.error {
        background: #f56c6c;
    }
</style>
<script src="./lib/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>歌单更新</h2>
        <div class="step-desc">
            操作步骤：<br>
            1. 填入你的个人密钥<br>
            2. 选择导入方式（Excel表格 或 粘贴JSON，二选一）<br>
            <span style="color:#409eff">Excel 自动识别飞书导出歌单表与旧 6 列模板，无需改表头</span><br>
            3. 数据会自动转换成预览<br>
            4. 确认内容无误，点击提交同步线上歌单与更新日期
        </div>
        <div class="item-box">
            <label>个人密钥</label>
            <input type="password" id="githubToken" placeholder="粘贴你的密钥">
            <div class="tip">密钥需要拥有修改这个歌单网站的权限，仅自己使用，不要发给别人</div>
        </div>
        <div class="mode-switch">
            <button class="mode-btn active" id="modeExcel">Excel上传</button>
            <button class="mode-btn" id="modeJson">粘贴JSON</button>
        </div>
        <div class="btn-group" id="excelArea">
            <button class="btn btn-upload" id="uploadBtn">选择Excel文件</button>
            <input type="file" id="fileInput" style="display: none;" accept=".xlsx,.xls">
        </div>
        <div class="item-box" id="jsonArea" style="display: none;">
            <label>粘贴 JSON 歌单数据（歌曲对象数组）</label>
            <textarea id="jsonInput" placeholder='格式示例：[{"title":"歌名","singer":"歌手","genre":"流行","style":"甜歌","lang":"中文","sc":"30"}]'></textarea>
            <div class="btn-group">
                <button class="btn btn-import" id="importJsonBtn">导入JSON</button>
            </div>
        </div>
        <div class="item-box">
            <label>转换结果预览（长内容可上下滑动）</label>
            <div class="tip" id="detectInfo"></div>
            <textarea id="jsonBox" readonly placeholder="导入表格或JSON后，数据会显示在这里"></textarea>
        </div>
        <div class="btn-group">
            <button class="btn btn-push" id="pushBtn" disabled>推送更新</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>
<script>
// 仓库固定配置，分支固定main
const REPO_OWNER = 'qylive';
const REPO_NAME = 'live';
const TARGET_JSON_FILE = 'songs.json';
const TARGET_HTML_FILE = 'index.html';
const FIX_BRANCH = 'main';
let pendingList = null;

const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const jsonBox = document.getElementById('jsonBox');
const detectInfo = document.getElementById('detectInfo');
const pushBtn = document.getElementById('pushBtn');
const githubToken = document.getElementById('githubToken');
const modeExcel = document.getElementById('modeExcel');
const modeJson = document.getElementById('modeJson');
const excelArea = document.getElementById('excelArea');
const jsonArea = document.getElementById('jsonArea');
const jsonInput = document.getElementById('jsonInput');
const importJsonBtn = document.getElementById('importJsonBtn');

// 导入方式二选一：切换时清空待推送状态，避免误推送
function switchMode(mode) {
    const isExcel = mode === 'excel';
    modeExcel.classList.toggle('active', isExcel);
    modeJson.classList.toggle('active', !isExcel);
    excelArea.style.display = isExcel ? 'block' : 'none';
    jsonArea.style.display = isExcel ? 'none' : 'block';
    pendingList = null;
    jsonBox.value = '';
    detectInfo.innerText = '';
    pushBtn.disabled = true;
    if (!isExcel) jsonInput.focus();
}
modeExcel.onclick = () => switchMode('excel');
modeJson.onclick = () => switchMode('json');

// 弹窗提示
function showToast(msg, type = 'default') {
    const toastEl = document.getElementById('toast');
    toastEl.className = 'toast show ' + type;
    toastEl.innerText = msg;
    setTimeout(() => toastEl.className = 'toast', 2800);
}

// 语言标准化处理：兼容「中/日/英」简写及「国语/日语/英语」等写法，未识别的值原样保留
function normalizeLang(lang) {
    if (lang === null || lang === undefined) return '';
    const s = String(lang).trim();
    if (!s) return '';
    const low = s.toLowerCase();
    if (/^(中|中文|国语|华语|汉语|普通话|粤语|广东话)$/.test(s) || s.includes('中文') || s.includes('国语') || s.includes('华语') || s.includes('粤语')) return '中文';
    if (/^(日|日文|日语)$/.test(s) || s.includes('日文') || s.includes('日语') || low === 'japanese' || low === 'ja' || low === 'jp') return '日文';
    if (/^(英|英文|英语)$/.test(s) || s.includes('英文') || s.includes('英语') || low === 'english' || low === 'en') return '英文';
    return s;
}

// 获取当日日期 YYYY-MM-DD
function getTodayDate() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}

// GitHub API 请求头
function getApiHeaders(token) {
    return {
        "Authorization": `token ${token}`,
        "Accept": "application/vnd.github.v3+json",
        "X-GitHub-Api-Version": "2022-11-28"
    };
}

// 无代理单文件更新
async function updateSingleFile(token, filePath, newContent, commitMsg) {
    const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}?ref=${FIX_BRANCH}`;
    const getRes = await fetch(getUrl, { headers: getApiHeaders(token) });
    if (!getRes.ok) {
        const errInfo = await getRes.json().catch(() => ({}));
        throw new Error(`读取文件失败：${errInfo.message || getRes.status}，请检查密钥权限`);
    }
    const fileInfo = await getRes.json();
    const b64 = btoa(unescape(encodeURIComponent(newContent)));
    const putUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;
    const putRes = await fetch(putUrl, {
        method: 'PUT',
        headers: {
            ...getApiHeaders(token),
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: commitMsg,
            content: b64,
            sha: fileInfo.sha,
            branch: FIX_BRANCH
        })
    });
    if (!putRes.ok) {
        const errInfo = await putRes.json().catch(() => ({}));
        throw new Error(`上传失败：${errInfo.message || putRes.status}`);
    }
    return true;
}

// 选择文件
uploadBtn.onclick = () => fileInput.click();

// 导入粘贴的JSON：校验并生成待推送列表
importJsonBtn.onclick = () => {
    const text = jsonInput.value.trim();
    if (!text) return showToast('请先粘贴 JSON 数据', 'error');
    let raw;
    try {
        raw = JSON.parse(text);
        if (!Array.isArray(raw)) throw new Error('必须是歌曲对象数组');
        if (raw.length === 0) throw new Error('数组为空，没有歌曲数据');
        raw.forEach((s, i) => {
            if (!s || typeof s !== 'object') throw new Error(`第${i+1}项不是对象`);
            if (!s.title || !s.singer) throw new Error(`第${i+1}项缺少 title 或 singer`);
        });
    } catch (err) {
        showToast('JSON 导入失败：' + err.message, 'error');
        return;
    }
    // 规范化字段：补齐缺省值，sc 统一为字符串（与 songs.json 格式一致）
    pendingList = raw.map(s => ({
        genre: s.genre || '',
        lang: s.lang || '',
        singer: s.singer,
        style: s.style || '',
        sc: s.sc != null ? String(s.sc) : '',
        title: s.title
    }));
    jsonBox.value = JSON.stringify(pendingList, null, 2);
    pushBtn.disabled = false;
    jsonInput.value = '';
    showToast(`JSON 导入成功，共 ${pendingList.length} 首，可以推送`, 'success');
};

// ===== Excel 解析：两套模板自动识别（无需手动选择） =====
// 1) 飞书导出歌单表：第2列歌名、第3列歌手、第4列语种、第5列曲风、第6列风格、第30列 sc价格（其余列忽略）
// 2) 旧固定模板：A歌名 | B歌手 | C类型(曲风[；风格]) | D语言 | E SC | F风格(可选)
// 两套都优先按「表头关键字」定位列，表头取名失败时才回退到该格式的固定列位。
const FIELD_KEYWORDS = {
    title: ['歌名', '歌曲名', '曲名', '标题', '歌曲'],
    singer: ['歌手', '演唱者', '演唱', '音乐人', '艺人'],
    lang: ['语种', '语言'],
    genre: ['曲风', '类型', '分类'],
    style: ['风格'],
    sc: ['sc价格', 'sc价', 'sc', '价格', '金额', '付费']
};
const LEGACY_COLS = { title: 0, singer: 1, genre: 2, lang: 3, sc: 4, style: 5 };
const FEISHU_COLS = { title: 1, singer: 2, lang: 3, genre: 4, style: 5, sc: 29 };

function cellText(v) {
    return v === null || v === undefined ? '' : String(v).trim();
}

// 按表头文字定位每列：完全相等得 2 分，包含关键字得 1 分，取最高分列
function buildColumnMap(headerCells) {
    const map = {};
    Object.keys(FIELD_KEYWORDS).forEach(field => {
        let bestIdx = -1, bestScore = 0;
        headerCells.forEach((cell, idx) => {
            const text = cellText(cell).toLowerCase();
            if (!text) return;
            let score = 0;
            FIELD_KEYWORDS[field].forEach(kw => {
                const k = kw.toLowerCase();
                if (text === k) score = Math.max(score, 2);
                else if (text.includes(k)) score = Math.max(score, 1);
            });
            if (score > bestScore) { bestScore = score; bestIdx = idx; }
        });
        if (bestIdx >= 0) map[field] = bestIdx;
    });
    return map;
}

// 在前 5 行里找关键字命中最多的一行作为表头（飞书导出可能带说明行）
function findHeaderRow(raw) {
    let best = { idx: 0, hits: 0, map: {} };
    raw.slice(0, 5).forEach((row, idx) => {
        const map = buildColumnMap(row || []);
        const hits = Object.keys(map).length;
        if (hits > best.hits) best = { idx, hits, map };
    });
    return best;
}

// 表头是否属于飞书导出格式：出现「语种/曲风/sc价格」或列数 ≥10
function isFeishuHeader(headerCells) {
    const texts = headerCells.map(cellText);
    return texts.some(t => t.includes('语种') || t.includes('曲风') || t.toLowerCase().includes('sc价格'))
        || headerCells.length >= 10;
}

// SC 金额：去掉 ¥ / 元 / 空格等，保留数字，去掉多余小数零（30.00 → 30）
function normalizeSc(v) {
    let s = cellText(v).replace(/[^\d.]/g, '');
    if (!s) return '';
    s = s.replace(/\.+$/, '');
    if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
}

fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const allow = ['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-excel'];
    if (!allow.includes(file.type) && !/\.xlsx?$/i.test(file.name)) {
        showToast('仅支持 xlsx / xls 表格', 'error');
        return;
    }
    detectInfo.innerText = '';
    try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        // defval 保证空单元格不塌陷，稀疏列（如第 7-29 列多为空）仍按原索引取值
        const raw = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', blankrows:false});
        if (!raw.length) throw new Error('表格为空，没有可解析的内容');
        const head = findHeaderRow(raw);
        const headerCells = raw[head.idx] || [];
        const colCount = headerCells.length;
        const feishu = isFeishuHeader(headerCells);
        const defaults = feishu ? FEISHU_COLS : LEGACY_COLS;
        const cols = Object.assign({}, defaults, head.map);
        if (head.hits < 3) {
            throw new Error('未识别表格格式：表头需包含「歌名/歌手/语种(语言)/曲风(类型)/风格/sc价格」等列名');
        }
        const rows = raw.slice(head.idx + 1);
        if (!rows.length) throw new Error('表格只有表头，没有歌曲数据');
        const list = [];
        let skipped = 0;
        for (let i = 0; i < rows.length; i++) {
            const r = rows[i] || [];
            const title = cellText(r[cols.title]);
            const singer = cellText(r[cols.singer]);
            if (!title && !singer) continue; // 整行空白直接忽略，不计入跳过
            if (!title || !singer) { skipped++; continue; }
            let genre = cellText(r[cols.genre]);
            let style = cellText(r[cols.style]);
            // 旧模板「类型」列可能写成「流行；甜歌」；飞书表曲风/风格分列，不触发此分支
            if (!feishu && genre) {
                const sep = genre.includes('；') ? '；' : (genre.includes(';') ? ';' : '');
                if (sep) {
                    const parts = genre.split(sep);
                    genre = cellText(parts[0]);
                    if (!style) style = cellText(parts[1] || '');
                }
            }
            list.push({
                genre,
                lang: normalizeLang(cellText(r[cols.lang])),
                singer,
                style,
                sc: normalizeSc(r[cols.sc]),
                title
            });
        }
        if (!list.length) throw new Error(`没有有效歌曲（跳过 ${skipped} 行缺少歌名/歌手的数据）`);
        pendingList = list;
        jsonBox.value = JSON.stringify(list, null, 2);
        pushBtn.disabled = false;
        const fmt = feishu ? '飞书导出格式' : '旧模板（6列）';
        detectInfo.innerText = `已识别：${fmt} · ${colCount} 列 · 共 ${list.length} 首`
            + (skipped ? ` · 跳过 ${skipped} 行（缺歌名/歌手）` : '');
        showToast(`表格转换完成，共 ${list.length} 首，可以提交`, 'success');
    } catch (err) {
        showToast('表格读取失败：' + err.message, 'error');
        jsonBox.value = '';
        pendingList = null;
        pushBtn.disabled = true;
        detectInfo.innerText = '';
    }
}

// 提交按钮逻辑
pushBtn.onclick = async () => {
    const token = githubToken.value.trim();
    const today = getTodayDate();
    if (!token) return showToast('请填写密钥', 'error');
    if (!pendingList) return showToast('请先导入表格或JSON', 'error');
    pushBtn.disabled = true;
    try {
        showToast('正在读取线上歌单，合并付费(SC)标记...');
        // 1. 读取线上 songs.json，构建「歌名|歌手」-> SC 映射（保留已有付费标记，避免上传覆盖丢失）
        const scMap = {};
        try {
            const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_JSON_FILE}?ref=${FIX_BRANCH}`;
            const getRes = await fetch(getUrl, { headers: getApiHeaders(token) });
            if (getRes.ok) {
                const info = await getRes.json();
                const oldText = decodeURIComponent(escape(atob(info.content)));
                JSON.parse(oldText).forEach(s => {
                    if (s.sc && String(s.sc).trim() !== '') {
                        scMap[`${s.title}|${s.singer}`] = String(s.sc).trim();
                    }
                });
            }
        } catch (e) { /* 读取失败不阻断，仍按 Excel 数据推送 */ }
        // 2. 合并：Excel 中 SC 为空时，沿用线上已有付费标记
        const finalJson = pendingList.map(s => {
            if (!s.sc) {
                const key = `${s.title}|${s.singer}`;
                if (scMap[key]) return { ...s, sc: scMap[key] };
            }
            return s;
        });
        if (!confirm(`确认将 ${finalJson.length} 首歌同步到线上？\n付费(SC)标记将按线上数据合并保留。`)) {
            pushBtn.disabled = false;
            return;
        }
        // 3. 更新线上歌曲列表（min压缩提交，预览仍为格式化）
        showToast('正在更新线上歌曲列表...');
        await updateSingleFile(token, TARGET_JSON_FILE, JSON.stringify(finalJson), '更新歌曲列表数据');
        showToast('正在同步页面更新时间...');
        // 4. 读取并修改index.html日期
        const htmlUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_HTML_FILE}?ref=${FIX_BRANCH}`;
        const htmlGet = await fetch(htmlUrl, { headers: getApiHeaders(token) });
        if (!htmlGet.ok) throw new Error('读取网站页面失败');
        const htmlInfo = await htmlGet.json();
        let htmlText = decodeURIComponent(escape(atob(htmlInfo.content)));
        const reg = /(<div class="update-info">last update: )(\d{4}-\d{2}-\d{2})(<\/div>)/;
        if (!reg.test(htmlText)) throw new Error('页面找不到更新日期文字，无法修改');
        htmlText = htmlText.replace(reg, `$1${today}$3`);
        await updateSingleFile(token, TARGET_HTML_FILE, htmlText, `更新页面最后更新日期${today}`);
        showToast(`全部更新成功！线上歌单与更新日期已同步为${today}`, 'success');
    } catch (err) {
        showToast('更新失败：' + err.message, 'error');
    } finally {
        pushBtn.disabled = false;
    }
}
</script>
</body>
</html>
