<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新歌单</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
    }
    body {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background-color: #f5f7fa;
    }
    .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h2 {
        text-align: center;
        color: #222;
        margin-bottom: 28px;
    }
    .item-box {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
    }
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        font-size: 14px;
    }
    .btn {
        padding: 12px 22px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: opacity 0.2s;
    }
    .btn:hover {
        opacity: 0.9;
    }
    .btn-upload {
        background: #409eff;
        color: white;
        margin-right: 12px;
    }
    .btn-push {
        background: #67c23a;
        color: white;
    }
    .btn:disabled {
        background: #c0c4cc;
        cursor: not-allowed;
        opacity: 0.7;
    }
    #jsonBox {
        width: 100%;
        height: 360px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        padding: 12px;
        overflow-y: auto;
        resize: none;
        background: #fafafa;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
    }
    .btn-group {
        margin: 20px 0;
    }
    .tip {
        font-size: 13px;
        color: #666;
        margin-top: 6px;
    }
    /* Toast弹窗样式 */
    .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #303133;
        color: #fff;
        border-radius: 6px;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
    }
    .toast.show {
        opacity: 1;
    }
    .toast.success {
        background: #67c23a;
    }
    .toast.error {
        background: #f56c6c;
    }
</style>
<!-- 引入SheetJS解析Excel CDN -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>更新歌单</h2>

        <!-- Github认证区域 -->
        <div class="item-box">
            <label>Github个人访问令牌(PAT)</label>
            <input type="password" id="githubToken" placeholder="填写拥有repo读写权限的PAT">
            <div class="tip">使用Tokens(classic)</div>
        </div>

        <!-- 上传按钮区域 -->
        <div class="btn-group">
            <button class="btn btn-upload" id="uploadBtn">选择Excel文件上传解析</button>
            <button class="btn btn-push" id="pushBtn" disabled>提交更新至Github（同步更新日期）</button>
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;">
        </div>

        <!-- JSON预览滚动文本框 -->
        <div class="item-box">
            <label>生成JSON预览（固定尺寸，可滚轮滚动）</label>
            <textarea id="jsonBox" readonly placeholder="上传Excel后，解析生成的JSON会展示在这里..."></textarea>
        </div>
    </div>

    <!-- Toast提示容器 -->
    <div class="toast" id="toast"></div>

    <script>
        // 仓库常量
        const REPO_OWNER = 'qylive';
        const REPO_NAME = 'live';
        const TARGET_JSON_FILE = 'test.json';
        const TARGET_HTML_FILE = 'index.html';
        let finalJson = null;

        // DOM元素
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const jsonBox = document.getElementById('jsonBox');
        const pushBtn = document.getElementById('pushBtn');
        const githubToken = document.getElementById('githubToken');
        const toastEl = document.getElementById('toast');

        // Toast工具
        function showToast(msg, type = 'default') {
            toastEl.className = 'toast show ' + type;
            toastEl.innerText = msg;
            setTimeout(() => {
                toastEl.className = 'toast';
            }, 2800);
        }

        // 标准化语言字段
        function normalizeLang(lang) {
            if (!lang) return '';
            const langStr = lang.toString().trim();
            if (langStr.includes('中')) return '中文';
            if (langStr.includes('英')) return '英文';
            if (langStr.includes('日')) return '日文';
            return langStr;
        }

        // 获取当前日期 YYYY-MM-DD
        function getTodayDate() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 唤起文件选择
        uploadBtn.addEventListener('click', () => fileInput.click());

        // Excel解析逻辑
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const acceptType = ['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'application/vnd.ms-excel'];
            if (!acceptType.includes(file.type) && !file.name.match(/\.(xlsx|xls)$/i)) {
                showToast('仅支持 .xlsx / .xls Excel文件', 'error');
                return;
            }
            try {
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(buf, { type: 'array' });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                const rows = rawData.slice(1);
                if (rows.length === 0) {
                    showToast('表格无有效数据', 'error');
                    jsonBox.value = '';
                    finalJson = null;
                    pushBtn.disabled = true;
                    return;
                }
                const output = [];
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i];
                    const title = r[0]?.toString().trim() || '';
                    const singer = r[1]?.toString().trim() || '';
                    const typeRaw = r[2]?.toString().trim() || '';
                    const rawLang = r[3]?.toString().trim() || '';
                    const scRaw = r[4]?.toString().trim() || '';
                    if (!title || !singer) {
                        showToast(`第${i+2}行：歌曲名/歌手不能为空，解析终止`, 'error');
                        jsonBox.value = '';
                        finalJson = null;
                        pushBtn.disabled = true;
                        return;
                    }
                    let genre = '', style = '';
                    if (typeRaw.includes(';')) {
                        const sp = typeRaw.split(';');
                        genre = sp[0].trim();
                        style = sp[1]?.trim() || '';
                    } else {
                        genre = typeRaw;
                    }
                    const lang = normalizeLang(rawLang);
                    output.push({ genre, lang, singer, style, sc: scRaw, title });
                }
                finalJson = output;
                jsonBox.value = JSON.stringify(output, null, 2);
                pushBtn.disabled = false;
                showToast('Excel解析完成，可提交推送', 'success');
            } catch (err) {
                console.error(err);
                showToast('解析失败：' + err.message, 'error');
                jsonBox.value = '';
                finalJson = null;
                pushBtn.disabled = true;
            }
        });

        // 批量更新Github：同时修改songs.json + index.html更新日期
        pushBtn.addEventListener('click', async () => {
            const token = githubToken.value.trim();
            const branch = 'main';
            const today = getTodayDate();
            if (!token) return showToast('请填写Github PAT令牌', 'error');
            if (!finalJson) return showToast('请先上传Excel生成JSON数据', 'error');
            try {
                showToast('正在拉取两份文件sha哈希...');
                // 并行获取两个文件原始内容与sha
                const [jsonRes, htmlRes] = await Promise.all([
                    fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_JSON_FILE}?ref=${branch}`, {
                        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
                    }),
                    fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_HTML_FILE}?ref=${branch}`, {
                        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
                    })
                ]);
                if (!jsonRes.ok) throw new Error(`获取${TARGET_JSON_FILE}失败(${jsonRes.status})`);
                if (!htmlRes.ok) throw new Error(`获取${TARGET_HTML_FILE}失败(${htmlRes.status})`);
                const jsonInfo = await jsonRes.json();
                const htmlInfo = await htmlRes.json();
                // 解码原始index.html文本
                let htmlRaw = decodeURIComponent(escape(atob(htmlInfo.content)));
                // 正则匹配目标行并替换日期
                const reg = /(<div class="update-info">last update: )(\d{4}-\d{2}-\d{2})(<\/div>)/;
                if (!reg.test(htmlRaw)) throw new Error('index.html未找到日期行，无法替换');
                htmlRaw = htmlRaw.replace(reg, `$1${today}$3`);
                // 编码两份文件内容为base64
                const newJsonStr = JSON.stringify(finalJson, null, 2);
                const jsonB64 = btoa(unescape(encodeURIComponent(newJsonStr)));
                const htmlB64 = btoa(unescape(encodeURIComponent(htmlRaw)));
                // 单次commit提交双文件
                const commitBody = {
                    message: `更新歌曲列表 & 更新页面日期至 ${today}`,
                    branch: branch,
                    files: {
                        [TARGET_JSON_FILE]: {
                            content: jsonB64,
                            sha: jsonInfo.sha
                        },
                        [TARGET_HTML_FILE]: {
                            content: htmlB64,
                            sha: htmlInfo.sha
                        }
                    }
                };
                const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        Accept: 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(commitBody)
                });
                if (!putRes.ok) {
                    const errData = await putRes.json();
                    throw new Error(errData.message || '提交失败');
                }
                showToast(`提交成功！已更新歌单 & index.html日期(${today})`, 'success');
            } catch (err) {
                console.error(err);
                showToast('推送失败：' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
