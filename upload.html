<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌单更新</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
    }
    body {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background-color: #f5f7fa;
    }
    .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h2 {
        text-align: center;
        color: #222;
        margin-bottom: 28px;
        font-size: 26px;
    }
    .item-box {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
    }
    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        font-size: 14px;
    }
    .btn {
        padding: 12px 22px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: opacity 0.2s;
    }
    .btn:hover {
        opacity: 0.9;
    }
    .btn-upload {
        background: #409eff;
        color: white;
        margin-right: 12px;
    }
    .btn-push {
        background: #67c23a;
        color: white;
    }
    .btn:disabled {
        background: #c0c4cc;
        cursor: not-allowed;
        opacity: 0.7;
    }
    #jsonBox {
        width: 100%;
        height: 360px;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        padding: 12px;
        overflow-y: auto;
        resize: none;
        background: #fafafa;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
    }
    .btn-group {
        margin: 20px 0;
    }
    .tip {
        font-size: 13px;
        color: #666;
        margin-top: 6px;
        line-height: 1.5;
    }
    .step-desc {
        background: #eef7ff;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 24px;
        line-height: 1.6;
        color: #224;
    }
    /* Toast弹窗样式 */
    .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #303133;
        color: #fff;
        border-radius: 6px;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
    }
    .toast.show {
        opacity: 1;
    }
    .toast.success {
        background: #67c23a;
    }
    .toast.error {
        background: #f56c6c;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>歌单更新</h2>
        <div class="step-desc">
            操作步骤：<br>
            1. 填入你的个人密钥<br>
            2. 点击按钮选择Excel歌曲表格<br>
            3. 表格会自动转换成预览数据<br>
            4. 确认内容无误，点击提交同步线上歌单与更新日期
        </div>
        <div class="item-box">
            <label>个人密钥</label>
            <input type="password" id="githubToken" placeholder="粘贴你的密钥">
            <div class="tip">密钥需要拥有修改这个歌单网站的权限，仅自己使用，不要发给别人</div>
        </div>
        <div class="btn-group">
            <button class="btn btn-upload" id="uploadBtn">选择Excel</button>
            <button class="btn btn-push" id="pushBtn" disabled>推送更新</button>
            <input type="file" id="fileInput" style="display: none;" accept=".xlsx,.xls">
        </div>
        <div class="item-box">
            <label>转换结果预览（长内容可上下滑动）</label>
            <textarea id="jsonBox" readonly placeholder="导入表格后，数据会显示在这里"></textarea>
        </div>
    </div>
    <div class="toast" id="toast"></div>
<script>
// 仓库固定配置，分支固定main
const REPO_OWNER = 'qylive';
const REPO_NAME = 'live';
const TARGET_JSON_FILE = 'songs.json';
const TARGET_HTML_FILE = 'index.html';
const FIX_BRANCH = 'main';
let finalJson = null;

const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const jsonBox = document.getElementById('jsonBox');
const pushBtn = document.getElementById('pushBtn');
const githubToken = document.getElementById('githubToken');

// 弹窗提示
function showToast(msg, type = 'default') {
    const toastEl = document.getElementById('toast');
    toastEl.className = 'toast show ' + type;
    toastEl.innerText = msg;
    setTimeout(() => toastEl.className = 'toast', 2800);
}

// 语言标准化处理
function normalizeLang(lang) {
    if (!lang) return '';
    const s = lang.toString().trim();
    if (s.includes('中')) return '中文';
    if (s.includes('英')) return '英文';
    if (s.includes('日')) return '日文';
    return s;
}

// 获取当日日期 YYYY-MM-DD
function getTodayDate() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}

// 优化Github请求头，标准API版本标识，减少预检失败概率
function getApiHeaders(token) {
    return {
        "Authorization": `token ${token}`,
        "Accept": "application/vnd.github.v3+json",
        "X-GitHub-Api-Version": "2022-11-28"
    };
}

// 无代理单文件更新
async function updateSingleFile(token, filePath, newContent, commitMsg) {
    const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}?ref=${FIX_BRANCH}`;
    const getRes = await fetch(getUrl, { headers: getApiHeaders(token) });
    if (!getRes.ok) {
        const errInfo = await getRes.json().catch(() => ({}));
        throw new Error(`读取文件失败：${errInfo.message || getRes.status}，请检查密钥权限`);
    }
    const fileInfo = await getRes.json();
    const b64 = btoa(unescape(encodeURIComponent(newContent)));
    const putUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;
    const putRes = await fetch(putUrl, {
        method: 'PUT',
        headers: {
            ...getApiHeaders(token),
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: commitMsg,
            content: b64,
            sha: fileInfo.sha,
            branch: FIX_BRANCH
        })
    });
    if (!putRes.ok) {
        const errInfo = await putRes.json().catch(() => ({}));
        throw new Error(`上传失败：${errInfo.message || putRes.status}`);
    }
    return true;
}

// 选择文件
uploadBtn.onclick = () => fileInput.click();

// 解析Excel
fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const allow = ['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-excel'];
    if (!allow.includes(file.type) && !/\.xlsx?$/i.test(file.name)) {
        showToast('仅支持 xlsx / xls 表格', 'error');
        return;
    }
    try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(sheet, {header:1});
        const rows = raw.slice(1);
        if (rows.length === 0) {
            showToast('表格无歌曲数据', 'error');
            jsonBox.value = '';
            finalJson = null;
            pushBtn.disabled = true;
            return;
        }
        const list = [];
        for(let i=0;i<rows.length;i++){
            const r = rows[i];
            const title = r[0]?.toString().trim() || '';
            const singer = r[1]?.toString().trim() || '';
            const typeRaw = r[2]?.toString().trim() || '';
            const rawLang = r[3]?.toString().trim() || '';
            const sc = r[4]?.toString().trim() || '';
            if (!title || !singer) {
                showToast(`第${i+2}行缺少歌名或歌手，无法转换`, 'error');
                jsonBox.value = '';
                finalJson = null;
                pushBtn.disabled = true;
                return;
            }
            let genre = '', style = '';
            if (typeRaw.includes('；')) {
                const arr = typeRaw.split('；');
                genre = arr[0].trim();
                style = arr[1]?.trim() || '';
            } else if (typeRaw.includes(';')) {
                const arr = typeRaw.split(';');
                genre = arr[0].trim();
                style = arr[1]?.trim() || '';
            } else {
                genre = typeRaw;
            }
            list.push({
                genre,
                lang: normalizeLang(rawLang),
                singer,
                style,
                sc,
                title
            });
        }
        finalJson = list;
        jsonBox.value = JSON.stringify(list, null, 2);
        pushBtn.disabled = false;
        showToast('表格转换完成，可以提交', 'success');
    } catch (err) {
        showToast('表格读取失败：' + err.message, 'error');
        jsonBox.value = '';
        finalJson = null;
        pushBtn.disabled = true;
    }
}

// 提交按钮逻辑
pushBtn.onclick = async () => {
    const token = githubToken.value.trim();
    const today = getTodayDate();
    if (!token) return showToast('请填写密钥', 'error');
    if (!finalJson) return showToast('请先导入表格', 'error');
    pushBtn.disabled = true;
    try {
        showToast('正在更新线上歌曲列表...');
        await updateSingleFile(token, TARGET_JSON_FILE, JSON.stringify(finalJson, null, 2), '更新歌曲列表数据');
        showToast('正在同步页面更新时间...');
        // 读取并修改index.html日期
        const htmlUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_HTML_FILE}?ref=${FIX_BRANCH}`;
        const htmlGet = await fetch(htmlUrl, { headers: getApiHeaders(token) });
        if (!htmlGet.ok) throw new Error('读取网站页面失败');
        const htmlInfo = await htmlGet.json();
        let htmlText = decodeURIComponent(escape(atob(htmlInfo.content)));
        const reg = /(<div class="update-info">last update: )(\d{4}-\d{2}-\d{2})(<\/div>)/;
        if (!reg.test(htmlText)) throw new Error('页面找不到更新日期文字，无法修改');
        htmlText = htmlText.replace(reg, `$1${today}$3`);
        await updateSingleFile(token, TARGET_HTML_FILE, htmlText, `更新页面最后更新日期${today}`);
        showToast(`全部更新成功！线上歌单与更新日期已同步为${today}`, 'success');
    } catch (err) {
        showToast('更新失败：' + err.message, 'error');
    } finally {
        pushBtn.disabled = false;
    }
}
</script>
</body>
</html>
