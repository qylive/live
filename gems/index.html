<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoW 自动收菜</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --line:#e3e8e6; --text:#1f2a27; --muted:#6b7a75;
    --accent:#1f8a70; --accent-d:#166957; --warn:#c8741a; --danger:#c0392b; --ok:#2e9e5b;
    --shadow:0 1px 3px rgba(20,40,35,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  header.top h1{font-size:20px;font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12px;background:#eef2f0;color:var(--muted)}
  .badge.running{background:#e6f4ec;color:var(--ok)}
  .badge.paused{background:#fdf1e3;color:var(--warn)}
  .badge.stopped{background:#eef2f0;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
  .card .label{color:var(--muted);font-size:12px;margin-bottom:6px}
  .card .value{font-size:20px;font-weight:600}
  .card .sub{color:var(--muted);font-size:12px;margin-top:4px}
  section.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
  section.panel h2{font-size:15px;margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  button{border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;background:#eef2f0;color:var(--text)}
  button.primary{background:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-d)}
  button.ghost{background:#fff;border-color:var(--line)}
  button.danger{background:#fbeae8;color:var(--danger)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  label.field{display:flex;flex-direction:column;gap:5px}
  label.field span{font-size:12px;color:var(--muted)}
  input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--text);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .table-scroll{max-height:360px;overflow-y:auto}
  .totals{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:18px;font-size:13px}
  .totals b{color:var(--accent-d)}
  .totals .group-label{color:var(--muted);margin-right:2px}
  .totals + .totals{border-top:none;margin-top:4px;padding-top:4px}
  .logbox{background:#1f2a27;color:#d7e2de;border-radius:10px;padding:12px;font-family:Consolas,monospace;font-size:12px;max-height:228px;overflow-y:auto;line-height:1.7}
  .logbox .t{color:#8fa8a1}
  .tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;background:#eef2f0;color:var(--muted)}
  .tag.auto{background:#e6f4ec;color:var(--ok)}
  .tag.manual{background:#fdf1e3;color:var(--warn)}
  .empty{color:var(--muted);text-align:center;padding:24px 0}
  .identity-info{display:flex;flex-wrap:wrap;gap:8px 18px;margin:-6px 2px 16px;font-size:12px;color:var(--muted)}
  .identity-info b{color:var(--text);font-weight:600}
  .identity-info .item{display:inline-flex;gap:6px;align-items:baseline}
  @media (max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>GoW 自动收菜</h1>
    <span id="statusBadge" class="badge stopped"><span class="dot"></span><span id="statusText">未启动</span></span>
  </header>

  <div class="cards">
    <div class="card"><div class="label">今日已收（自动）</div><div class="value" id="todayCount">0</div><div class="sub" id="todayCap">上限 23 次</div></div>
    <div class="card"><div class="label">上次收菜</div><div class="value" id="lastRun">—</div><div class="sub" id="lastGems">宝石 +0</div></div>
    <div class="card"><div class="label">下次执行</div><div class="value" id="nextRun">—</div><div class="sub" id="nextRunNote">含随机抖动</div></div>
    <div class="card"><div class="label">账号</div><div class="value" id="accountName">未配置</div><div class="sub" id="accountUser">—</div></div>
  </div>

  <div id="identityInfo" class="identity-info"></div>

  <section class="panel">
    <h2>控制</h2>
    <div class="actions">
      <button id="btnStart" class="primary">开始调度</button>
      <button id="btnPause" class="ghost" disabled>暂停</button>
      <button id="btnResume" class="ghost" disabled>继续</button>
      <button id="btnProbe" class="ghost">连通性探测</button>
      <button id="btnNow" class="ghost">立即收菜（手动）</button>
    </div>
    <div class="hint">调度按“距上次收菜 ≥ 等待分钟数 + 0～抖动分钟随机”执行；等待窗口内不主动请求服务器，到点才校验一次。若检测到已在游戏内手动收取，会按服务端时间自动顺延下一窗口，不会重复领取。页面需保持打开，关闭后后台不会继续收菜。</div>
  </section>

  <section class="panel">
    <h2>账号与调度配置</h2>
    <div class="grid">
      <label class="field"><span>邀请码（NameCode）</span><input id="inviteCode" placeholder="如 MIKAZUKI_SR9D"></label>
      <label class="field"><span>用户名（留空则按邀请码自动反查）</span><input id="username" placeholder="API username"></label>
      <label class="field"><span>密码（持久凭据，仅存本机浏览器）</span><input id="password" type="password" placeholder="持久密码"></label>
      <label class="field"><span>等待分钟数（须 ≥ 60）</span><input id="waitMinutes" type="number" min="60" value="60"></label>
      <label class="field"><span>随机抖动分钟（0～3）</span><input id="jitterMinutes" type="number" min="0" max="3" step="0.5" value="3"></label>
      <label class="field"><span>每日自动上限（次）</span><input id="maxPerDay" type="number" min="1" value="23"></label>
    </div>
    <div class="row" style="margin-top:12px;gap:16px">
      <label class="field" style="flex-direction:row;align-items:center;gap:6px"><input id="dryRun" type="checkbox" style="width:auto"><span>试运行（不真正提交）</span></label>
      <button id="btnSave" class="primary">保存配置</button>
    </div>
    <div class="hint">配置与收菜记录保存在本机浏览器 localStorage，不会上传到任何第三方；换浏览器或清理缓存后需重新填写。</div>
  </section>

  <section class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin-bottom:0">收菜记录与报表 <span class="tag">后续可扩展图表统计</span></h2>
      <label class="field" style="flex-direction:row;align-items:center;gap:6px;width:auto"><span>日期筛选</span><input id="filterDate" type="date" style="width:auto"></label>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>时间</th><th>来源</th><th>宝石</th><th>金币</th><th>灵魂</th><th>钥匙</th><th>荣誉</th></tr></thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
    <div class="totals" id="totalsDay"></div>
    <div class="totals" id="totalsAll"></div>
  </section>

  <section class="panel">
    <h2>运行日志</h2>
    <div id="logbox" class="logbox"></div>
  </section>

</div>

<script>
"use strict";
/* ===================== 常量与状态 ===================== */
const API = "https://pcmob.parse.gemsofwar.com/call_function";
const CFG_KEY = "gow_harvest_cfg";
const LEDGER_KEY = "gow_harvest_ledger";

const DEFAULTS = {
  inviteCode: "", username: "", password: "",
  waitMinutes: 60, jitterMinutes: 3, maxPerDay: 23, dryRun: false,
  clientVersion: "9.4.0r85161", platform: "PC_CLIENT",
  lc: "zh", paymentCountry: "CN", paymentCurrency: "CNY",
  steamid: ""
};

let cfg = loadJSON(CFG_KEY, DEFAULTS);
let ledger = loadJSON(LEDGER_KEY, []);
let token = null;
let sessionId = randId();
let status = "stopped";           // stopped / running / paused / probing / collecting
let lastRunAt = null;
let lastCollectMs = null;
let lastReward = {};
let nextRunAt = null;
let timer = null;
let busy = false;
let lastRenderedDay = localDate(Date.now());
let filterDate = localDate(Date.now()); // 报表所选日期（本地自然日）
let clockOffset = 0; // 本地毫秒 - 服务器毫秒（本地偏快为正）
let profileLastCollect = null; // 服务端 LastCollectTime（公开资料）
let profileNextReady = null;   // LastCollectTime + 等待分钟
let profileName = "";
let profileLevel = null;

/* ===================== 工具 ===================== */
function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : JSON.parse(JSON.stringify(fallback)); }
  catch(e){ return JSON.parse(JSON.stringify(fallback)); }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function randId(){ return Math.random().toString(36).slice(2,18); }
function nowMs(){ return Date.now(); }
function serverNow(){ return Date.now() - clockOffset; } // 服务器口径当前毫秒
function fmtTime(ms){ if(!ms) return "—"; const d=new Date(ms); return d.toLocaleString("zh-CN",{hour12:false}); }
function localDate(ms){ const d=new Date(ms??Date.now()); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function todayStr(){ return localDate(Date.now()); }
function nextMidnightMs(){ const d=new Date(); d.setHours(24,0,0,30); return d.getTime(); } // 本地次日 00:00:30
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function log(msg, level="info"){
  const box = document.getElementById("logbox");
  const line = document.createElement("div");
  line.innerHTML = `<span class="t">${fmtTime(nowMs())}</span> ${esc(msg)}`;
  box.appendChild(line);
  while(box.children.length > 300) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

/* ===================== API 封装 ===================== */
function envelope(fn, extra={}){
  return Object.assign({
    functionName: fn,
    username: cfg.username, password: cfg.password,
    clientCallTime: nowMs(), clientVersion: cfg.clientVersion,
    ServerToken: token, platform: cfg.platform,
    analyticsSessionId: sessionId, lc: cfg.lc,
    paymentCountry: cfg.paymentCountry, paymentCurrency: cfg.paymentCurrency
  }, extra);
}

async function apiCall(body){
  const resp = await fetch(API, {
    method:"POST",
    headers:{"Content-Type":"application/json; charset=utf-8"},
    body: JSON.stringify(body)
  });
  const ans = await resp.json();
  if(ans.error && !ans.result) throw new Error(typeof ans.error==="string"?ans.error:JSON.stringify(ans.error));
  return ans.result ?? ans;
}

async function login(){
  const r = await apiCall(envelope("login_user", {
    facebook:0, fullScreen:1, hint:2, music:1, rated:0,
    savetime:1423527580051, sound:1,
    ConsoleId: cfg.steamid, Platform:2, GetDebugTasks:false, language: cfg.lc
  }));
  token = r.ServerToken;
  if(!token) throw new Error("登录未下发 ServerToken");
  log("登录成功，会话令牌已刷新");
  return r;
}

async function resolveUsername(){
  if(!cfg.inviteCode) throw new Error("请先填写邀请码");
  const u = await apiCall({
    clientVersion:cfg.clientVersion, platform:cfg.platform,
    functionName:"download_user_names", SearchText:cfg.inviteCode, StartAt:0, Limit:500
  });
  const list = u.Usernames || [];
  const item = list.find(x=>x.Name===cfg.inviteCode) || list[0];
  if(!item) throw new Error("邀请码未查到账号");
  const prof = await apiCall({
    clientVersion:cfg.clientVersion, platform:cfg.platform,
    functionName:"get_hero_profile", Id:item.Id
  });
  const pd = prof.ProfileData || {};
  cfg.username = pd.username || "";
  return pd;
}

async function fetchProfile(){
  const u = await apiCall({clientVersion:cfg.clientVersion,platform:cfg.platform,functionName:"download_user_names",SearchText:cfg.inviteCode,StartAt:0,Limit:500});
  const list=u.Usernames||[];
  const item=list.find(x=>x.Name===cfg.inviteCode)||list[0]; if(!item) return null;
  const prof=await apiCall({clientVersion:cfg.clientVersion,platform:cfg.platform,functionName:"get_hero_profile",Id:item.Id});
  const pd=prof.ProfileData||{};
  if(typeof pd.ServerTime==="number") clockOffset = Date.now()-pd.ServerTime;
  return pd;
}

async function serverLastCollect(){
  if(!cfg.inviteCode) return null;
  try{
    const pd=await fetchProfile();
    return pd && typeof pd.LastCollectTime==="number"?pd.LastCollectTime:null;
  }catch(e){ log("就绪状态查询失败: "+e.message, "warn"); return null; }
}

async function refreshIdentity(){
  if(!cfg.inviteCode) return;
  try{
    const pd=await fetchProfile(); if(!pd) return;
    profileLastCollect=typeof pd.LastCollectTime==="number"?pd.LastCollectTime:null;
    profileName=pd.Name||""; profileLevel=pd.Level??null;
    if(!cfg.username && pd.username) cfg.username=pd.username;
    if(profileLastCollect) profileNextReady=profileLastCollect+cfg.waitMinutes*60*1000;
    render();
  }catch(e){ log("资料查询失败: "+e.message,"warn"); }
}

/* ===================== 奖励解析 ===================== */
const TR_FIELDS = ["TributeGoldToCollect","TributeSoulsToCollect","TributeKeysToCollect","TributeGloryToCollect","TributeGemsToCollect"];
const GOLD_FIELDS = ["GoldToCollect","HomeGoldToCollect","OtherGoldToCollect"];
const num = (o,k)=> (typeof o?.[k]==="number"?o[k]:0);

function parseRewards(result){
  const tr = Object.fromEntries(TR_FIELDS.map(f=>[f,num(result,f)]));
  const gold = Object.fromEntries(GOLD_FIELDS.map(f=>[f,num(result,f)]));
  const hero = result.NewHeroData || {};
  return {
    tribute: !!result.Tribute,
    tributeRewards: tr, regularGold: gold,
    balances:{ Gold:hero.Gold, Gems:hero.Gems, Souls:hero.Souls },
    lastCollectTime: hero.LastCollectTime, serverTime: hero.ServerTime
  };
}

function todayAutoCount(){
  const t = localDate(Date.now());
  return ledger.filter(r=>localDate(r.ts)===t && r.source==="auto").length;
}

/* ===================== 收菜 ===================== */
async function collectOnce(source="auto"){
  const waitMs = cfg.waitMinutes*60*1000;

  if(source==="auto" && todayAutoCount() >= cfg.maxPerDay){
    log(`今日已达上限 ${cfg.maxPerDay} 次，已排到次日 00:00 后继续`, "warn");
    nextRunAt = nextMidnightMs(); // 跨天计数自动归 0，到次日零点再复核；冷却窗口仍由就绪判断把关
    render();
    return {ok:false,reason:"daily_cap"};
  }

  // 到点后单次向服务端校验上次收菜时间；等待窗口内不做任何轮询请求
  const srvLast = await serverLastCollect();
  if(srvLast!=null){
    if(lastCollectMs && srvLast > lastCollectMs + 1000){
      log("检测到服务端收菜时间已更新（可能已在游戏内手动收取），按服务端时间顺延");
    }
    lastCollectMs = srvLast;
    profileLastCollect = srvLast;
    profileNextReady = srvLast + waitMs;
  }
  const ref = lastCollectMs || lastRunAt;
  if(ref && serverNow()-ref < waitMs){
    const remain = Math.ceil((waitMs-(serverNow()-ref))/1000);
    log(`距上次收菜不足 ${cfg.waitMinutes} 分钟（约剩 ${remain} 秒），跳过并顺延下一轮`);
    scheduleNext();
    render();
    return {ok:false,reason:"not_ready"};
  }

  setStatus("collecting");
  try{
    if(!cfg.username && cfg.inviteCode){
      try{ const pd=await resolveUsername(); cfg.username=pd.username||""; saveJSON(CFG_KEY,cfg); }catch(e){}
    }
    if(!token) await login();

    if(cfg.dryRun){
      log("[dry-run] 试运行：未真正提交 collect_gold");
      return {ok:true,dryRun:true};
    }

    const result = await apiCall(envelope("collect_gold"));
    const rewards = parseRewards(result);
    if(rewards.lastCollectTime){ lastCollectMs = rewards.lastCollectTime; profileLastCollect = rewards.lastCollectTime; profileNextReady = rewards.lastCollectTime + cfg.waitMinutes*60*1000; }
    lastRunAt = nowMs();
    lastReward = rewards;

    const entry = {
      ts:lastRunAt, date:localDate(lastRunAt), source,
      classification:null, ...rewards
    };
    ledger.push(entry);
    saveJSON(LEDGER_KEY, ledger);

    const tr=rewards.tributeRewards;
    if(rewards.tribute && Object.values(tr).some(v=>v>0)){
      log(`收菜成功｜贡品 gold=${tr.TributeGoldToCollect} souls=${tr.TributeSoulsToCollect} keys=${tr.TributeKeysToCollect} glory=${tr.TributeGloryToCollect} gems=${tr.TributeGemsToCollect}`);
    }else{
      log("本轮无可领取贡品（未就绪或奖励为 0）");
    }
    scheduleNext();
    render();
    return {ok:true, rewards};
  }catch(e){
    log("本轮收菜异常: "+e.message, "error");
    token = null;
    return {ok:false, error:e.message};
  }finally{
    if(status==="collecting") setStatus(timer?"running":"stopped");
  }
}

/* ===================== 调度 ===================== */
function scheduleNext(){
  const waitMs = cfg.waitMinutes*60*1000;
  const jitterMs = Math.random()*cfg.jitterMinutes*60*1000;
  const base = lastCollectMs || lastRunAt;
  const delay = base ? (base+waitMs-serverNow()+jitterMs) : (waitMs+jitterMs);
  nextRunAt = nowMs() + Math.max(delay, 5000);
}

function tick(){
  if(status!=="running" || busy) return;
  // 跨自然日时先刷新计数卡片（不请求服务器），计数随日期自动归 0
  const today = localDate(nowMs());
  if(today!==lastRenderedDay){ lastRenderedDay=today; render(); }
  if(nextRunAt==null || nowMs()>=nextRunAt){
    busy = true;
    collectOnce("auto").finally(()=>{ busy=false; if(nextRunAt==null) scheduleNext(); });
  }
}

function start(){
  if(status==="running") return;
  if(!cfg.username && !cfg.inviteCode){ log("请先在配置页填写邀请码或用户名", "warn"); return; }
  setStatus("running");
  nextRunAt = null; // 启动先跑一轮
  if(timer) clearInterval(timer);
  timer = setInterval(tick, 5000);
  log("调度已启动");
}
function pause(){ if(status==="running"){ setStatus("paused"); log("调度已暂停"); } }
function resume(){ if(status==="paused"){ setStatus("running"); log("调度已继续"); } }
function stopAll(){ if(timer){clearInterval(timer);timer=null;} setStatus("stopped"); }

function setStatus(s){
  status = s;
  const badge=document.getElementById("statusBadge"), txt=document.getElementById("statusText");
  const map={running:["running","运行中"],paused:["paused","已暂停"],stopped:["stopped","未启动"],probing:["running","探测中"],collecting:["running","收菜中"]};
  const [cls,label]=map[s]||map.stopped;
  badge.className="badge "+cls; txt.textContent=label;
  document.getElementById("btnPause").disabled = s!=="running";
  document.getElementById("btnResume").disabled = s!=="paused";
}

/* ===================== 配置读写 ===================== */
function readForm(){
  return {
    inviteCode:document.getElementById("inviteCode").value.trim(),
    username:document.getElementById("username").value.trim(),
    password:document.getElementById("password").value,
    waitMinutes:Number(document.getElementById("waitMinutes").value)||60,
    jitterMinutes:Number(document.getElementById("jitterMinutes").value)||0,
    maxPerDay:Number(document.getElementById("maxPerDay").value)||23,
    dryRun:document.getElementById("dryRun").checked
  };
}
function fillForm(){
  document.getElementById("inviteCode").value=cfg.inviteCode||"";
  document.getElementById("username").value=cfg.username||"";
  document.getElementById("password").value=cfg.password||"";
  document.getElementById("waitMinutes").value=cfg.waitMinutes;
  document.getElementById("jitterMinutes").value=cfg.jitterMinutes;
  document.getElementById("maxPerDay").value=cfg.maxPerDay;
  document.getElementById("dryRun").checked=!!cfg.dryRun;
}

async function saveConfig(){
  const f=readForm();
  f.waitMinutes=Math.max(60, Number(f.waitMinutes)||60);
  f.jitterMinutes=Math.min(3, Math.max(0, Number(f.jitterMinutes)||0));
  f.maxPerDay=Math.max(1, Number(f.maxPerDay)||23);
  Object.assign(cfg,f);
  if(!cfg.username && cfg.inviteCode){
    try{ const pd=await resolveUsername(); cfg.username=pd.username||""; document.getElementById("username").value=cfg.username; log("已按邀请码反查用户名"); }
    catch(e){ log("反查用户名失败: "+e.message,"warn"); }
  }
  saveJSON(CFG_KEY,cfg);
  // 按新等待分钟数刷新预计可收时间；调度进行中则用新参数实时重排下一轮
  if(profileLastCollect) profileNextReady=profileLastCollect+cfg.waitMinutes*60*1000;
  if(timer) scheduleNext();
  log("配置已保存，调度参数已实时生效");
  render();
  refreshIdentity();
}

/* ===================== 渲染 ===================== */
function render(){
  document.getElementById("todayCount").textContent = todayAutoCount();
  document.getElementById("todayCap").textContent = `上限 ${cfg.maxPerDay} 次`;
  const lastRef = profileLastCollect || lastRunAt;
  document.getElementById("lastRun").textContent = fmtTime(lastRef);
  const gems = lastReward.tributeRewards?.TributeGemsToCollect ?? 0;
  document.getElementById("lastGems").textContent = `宝石 +${gems}`;
  document.getElementById("nextRun").textContent = fmtTime(nextRunAt || profileNextReady);
  document.getElementById("nextRunNote").textContent = nextRunAt ? "含随机抖动" : "预计就绪（未计抖动）";
  document.getElementById("accountName").textContent = profileName || cfg.inviteCode || "未配置";
  document.getElementById("accountUser").textContent = cfg.username || "—";

  // 身份/就绪信息条
  const offSec=(clockOffset/1000).toFixed(1);
  const info=[];
  if(profileName) info.push(`<span class="item">角色 <b>${esc(profileName)}</b></span>`);
  if(profileLevel!=null) info.push(`<span class="item">等级 <b>${profileLevel}</b></span>`);
  if(profileLastCollect) info.push(`<span class="item">上次收菜 <b>${fmtTime(profileLastCollect)}</b></span>`);
  if(profileNextReady) info.push(`<span class="item">预计可收 <b>${fmtTime(profileNextReady)}</b></span>`);
  info.push(`<span class="item">时钟偏差 <b>${offSec}s</b></span>`);
  document.getElementById("identityInfo").innerHTML = info.join("");

  // 记录表（按所选日期筛选）
  document.getElementById("filterDate").value = filterDate;
  const dayRows = ledger.filter(r=>localDate(r.ts)===filterDate);
  const body=document.getElementById("ledgerBody");
  if(!dayRows.length){ body.innerHTML=`<tr><td colspan="7" class="empty">该日期暂无收菜记录</td></tr>`; }
  else{
    body.innerHTML = dayRows.slice().reverse().map(r=>{
      const tr=r.tributeRewards||{}, g=r.regularGold||{};
      const gold=(tr.TributeGoldToCollect??0)+(g.GoldToCollect??0);
      const srcTag=r.source==="auto"?`<span class="tag auto">自动</span>`:`<span class="tag manual">手动</span>`;
      return `<tr><td>${fmtTime(r.ts)}</td><td>${srcTag}</td><td>${tr.TributeGemsToCollect??0}</td><td>${gold}</td><td>${tr.TributeSoulsToCollect??0}</td><td>${tr.TributeKeysToCollect??0}</td><td>${tr.TributeGloryToCollect??0}</td></tr>`;
    }).join("");
  }

  // 累计统计：所选日期 + 历史总计；贡品金币与常规金币合并为金币
  const totalsHtml=(rows,label)=>{
    const sum=f=>rows.reduce((s,r)=>s+((r.tributeRewards||{})[f]||0),0);
    const gold=rows.reduce((s,r)=>s+((r.tributeRewards||{}).TributeGoldToCollect||0)+((r.regularGold||{}).GoldToCollect||0),0);
    return `<span class="group-label">${label}</span>`+
      `<span>宝石 <b>${sum("TributeGemsToCollect")}</b></span>`+
      `<span>金币 <b>${gold}</b></span>`+
      `<span>灵魂 <b>${sum("TributeSoulsToCollect")}</b></span>`+
      `<span>钥匙 <b>${sum("TributeKeysToCollect")}</b></span>`+
      `<span>荣誉 <b>${sum("TributeGloryToCollect")}</b></span>`;
  };
  document.getElementById("totalsDay").innerHTML = totalsHtml(dayRows, `所选日期 ${filterDate||"—"}`);
  document.getElementById("totalsAll").innerHTML = totalsHtml(ledger, "历史总计");
}

/* ===================== 事件绑定 ===================== */
document.getElementById("btnStart").onclick=start;
document.getElementById("btnPause").onclick=pause;
document.getElementById("btnResume").onclick=resume;
document.getElementById("btnSave").onclick=saveConfig;
document.getElementById("btnNow").onclick=()=>collectOnce("manual-trigger");
document.getElementById("filterDate").onchange=e=>{ filterDate=e.target.value||localDate(Date.now()); render(); };
document.getElementById("btnProbe").onclick=async()=>{
  setStatus("probing");
  try{
    await refreshIdentity();
    await login();
    saveJSON(CFG_KEY,cfg);
    const offSec=(clockOffset/1000).toFixed(1);
    log(`探测成功｜角色 ${profileName||cfg.username}（${cfg.inviteCode}）等级 ${profileLevel??"—"}｜本机时钟偏差 ${offSec} 秒`);
  }catch(e){ log("探测失败: "+e.message,"error"); }
  finally{ setStatus(timer?"running":"stopped"); render(); }
};

fillForm();
render();
if(cfg.inviteCode) refreshIdentity();
log("页面已就绪，填写邀请码与密码后可开始调度");
</script>
</body>
</html>
