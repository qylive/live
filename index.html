<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栖苑歌单</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<style>
/* 全局样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
/* 背景 - 优化移动端背景展示 */
body {
    background-size: cover;
    color: #fff;
    position: relative;
}
/* 背景遮罩 */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 80, 200, 0.6);
    z-index: -1;
}
/* 右上角按钮 - 核心调整：仅修改定位参数，保留原有样式 */
.top-right-btn {
    position: fixed;
    /* 调整PC端位置：向右微调，向下微调，避免过于贴边 */
    top: 25px; 
    right: 15%; 
    z-index: 998;
    padding: 10px 18px;
    background: #e955a7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.top-right-btn:hover {
    background: #d645a7;
}
/* ========== 右上角堆叠气泡提示框 ========== */
#toast-container {
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast-item {
    padding: 12px 20px;
    background: rgba(76, 175, 80, 0.9);
    color: #fff;
    border-radius: 6px;
    font-size: 14px;
    min-width: 220px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateX(120%);
    transition: all 0.3s ease;
    pointer-events: none;
}
.toast-item.show {
    opacity: 1;
    transform: translateX(0);
}
.toast-item.error {
    background: rgba(244, 67, 54, 0.9);
}
/* ======================================== */
/* 头部信息 */
.header {
    text-align: center;
    padding: 40px 0;
}
.avatar {
    width: 256px;
    height: 256px;
    border-radius: 50%;
    border: 4px solid #fff;
    margin-bottom: 20px;
}
.header h1 {
    font-size: 28px;
    color: #ff99cc;
    margin-bottom: 10px;
}
.header p {
    font-size: 20px;
    color: #e0c0ff;
    margin-bottom: 10px;
}
.update-info {
    font-size: 14px;
    color: #ccc;
}
/* 筛选栏 - 保留原有70%宽度，不修改 */
.filter-bar {
    width: 70%;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
}
.filter-btn {
    padding: 18px 48px;
    border: none;
    border-radius: 20px;
    background: #b388ff;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
}
.filter-btn:hover, .filter-btn.active {
    background: #805acb;
    transform: scale(1.05);
}
/* 搜索和功能按钮 - 保留原有70%宽度，不修改 */
.search-bar {
    width: 70%;
    margin: 0 auto 20px;
    display: flex;
    gap: 10px;
}
.shuffle-btn, .random-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff80ab;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    white-space: nowrap;
}
.shuffle-btn:hover, .random-btn:hover {
    background: #f50057;
}
.search-input {
    flex: 1;
    padding: 10px 15px;
    border: 2px solid #d1c4e9;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    font-size: 16px;
    min-width: 0;
}
.search-input::placeholder {
    color: #e0e0e0;
}
/* 列表容器 - 保留原有70%宽度和高度，不修改 */
.list-container {
    width: 70%;
    margin: 0 auto;
    max-height: 600px;
    overflow-y: auto;
    border-radius: 10px;
    background: rgba(100, 60, 180, 0.5);
    padding: 10px;
}
/* 自定义滚动条 */
.list-container::-webkit-scrollbar {
    width: 8px;
}
.list-container::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
}
.list-container::-webkit-scrollbar-thumb {
    background: #b388ff;
    border-radius: 4px;
}
/* 列表表头和行 - PC端四列样式 */
.song-list {
    width: 100%;
    border-collapse: collapse;
}
.song-list th, .song-list td {
    padding: 12px 8px;
    text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}
.song-list th {
    color: #ff99cc;
    font-weight: bold;
}
/* 表格列宽比例：歌名:歌手:类别 = 4:4:1.5 */
.song-list th:nth-child(2),
.song-list td:nth-child(2) {
  width: 40%;
}
.song-list th:nth-child(3),
.song-list td:nth-child(3) {
  width: 40%;
}
.song-list th:nth-child(4),
.song-list td:nth-child(4) {
  width: 15%;
}
/* 序号列自动占剩余 */
.song-list th:nth-child(1),
.song-list td:nth-child(1) {
  width: auto;
  white-space: nowrap;
}
/* PC端行样式 */
.pc-row {
    display: table-row;
	line-height: 32px;
}
.song-list tr:hover {
    background: rgba(255, 255, 255, 0.1);
    cursor: pointer;
}
/* 移动端行容器（默认隐藏） */
.mobile-row {
    display: none;
}

/* ========== 改版紧凑半透明弹窗（无关闭按钮、调整字号按钮间距） ========== */
.random-modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.random-modal-mask.show {
    display: flex;
}
/* 弹窗改为更高透明度半透底色 */
.random-modal-box {
    width: 800px;
    max-width: 100%;
    background: rgba(110, 70, 190, 0.72);
    border-radius: 20px;
    padding: 22px 22px;
    position: relative;
    box-shadow: 0 6px 26px rgba(0,0,0,0.25);
}
/* 移除右上角关闭按钮样式，直接删掉该类 */
/* 歌名大标题：下边距收紧 */
.modal-song-title {
    font-size: 34px;
    font-weight: bold;
    color: #ffffff;
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.2;
}
/* 付费徽章嵌入歌名右侧 */
.modal-title-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 7px;
    border-radius: 6px;
    background-color: #ffd700;
    color: #000;
    font-size: 13px;
    font-weight: bold;
    vertical-align: middle;
}
/* 歌手文字缩小，字号大于标签 */
.modal-singer-text {
    font-size: 17px;
    color: #e8d8ff;
    text-align: center;
    margin-bottom: 14px;
}
/* 标签容器整体缩小，间距微调 */
.modal-tag-wrap {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.modal-tag-item {
    padding: 5px 14px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    color: #fff;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
}
/* 底部按钮扩大间距、缩小按钮尺寸 */
.modal-btn-group {
    display: flex;
    gap: 30px;
}
.modal-action-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
}
.btn-copy-song {
    background: #4caf50;
    color: #fff;
}
.btn-copy-song:hover {
    background: #388e3c;
}
.btn-re-random {
    background: #ff80ab;
    color: #fff;
}
.btn-re-random:hover {
    background: #f50057;
}
/* 移动端小屏适配 */
@media (max-width: 480px) {
    .random-modal-box {
        padding: 18px 16px;
    }
    .modal-song-title {
        font-size: 26px;
        margin-bottom: 10px;
		height: 60px;
    }
    .modal-singer-text {
        font-size: 15px;
        margin-bottom: 12px;
    }
    .modal-tag-wrap {
        gap: 6px;
        margin-bottom: 18px;
    }
    .modal-tag-item {
        font-size: 12px;
        padding: 4px 10px;
    }
    .modal-action-btn {
        padding: 8px 0;
        font-size: 14px;
    }
    .modal-title-badge {
        font-size: 11px;
        padding: 2px 5px;
    }
}
/* =========================================== */

/* ===================== 移动端优雅适配 ===================== */
@media (max-width: 768px) {
    /* 移动端背景调整：显示右侧30%内容 */
    body {
        background: url('./bgi-w-idol.jpg') no-repeat right center fixed;
        background-size: cover;
        /* 关键：将背景定位到右侧，只展示右边30% */
        background-position-x: 70%;
    }
    .header { padding: 20px 0; }
    .avatar { width: 160px; height: 160px; }
    .header h1 { font-size: 22px; }
    .header p { font-size: 16px; }
    
    .filter-bar { width: 95%; }
    .filter-btn { padding: 10px 20px; font-size: 14px; }
    
    .search-bar { width: 95%; }
    .shuffle-btn, .random-btn { padding: 10px 12px; font-size: 14px; }
    
    .list-container { width: 95%; max-height: 480px; }
    
    /* 移动端表格样式重置 */
    .song-list thead {
        display: none;
    }
    /* 隐藏PC端行，显示移动端行 */
    .pc-row {
        display: none;
    }
    .mobile-row {
        display: table-row;
    }
    .mobile-row > td {
        padding: 15px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    /* 移动端左侧内容（序号+标题+歌手） */
    .mobile-left {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex: 1;
    }
    /* 移动端序号 */
    .mobile-index {
        color: #ff99cc;
        font-weight: bold;
        font-size: 14px;
        min-width: 20px;
        margin-top: 2px;
    }
    /* 移动端标题歌手容器 */
    .mobile-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    /* 移动端歌名和歌手 */
    .mobile-title {
        font-size: 16px;
        font-weight: bold;
    }
    .mobile-singer {
        font-size: 14px;
        color: #ccc;
    }
    /* 移动端右侧类别 */
    .mobile-category {
        color: #e0c0ff;
        font-size: 13px;
        text-align: right;
        min-width: 80px;
        /* 确保类别垂直居中 */
        display: flex;
        align-items: center;
        justify-content: flex-end;
    }
    /* 移动端行hover效果 */
    .mobile-row:hover > td {
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
    }
    /* 移动端右上角按钮适配 */
    .top-right-btn {
        top: 15px;
        right: 15px;
        font-size: 18px;
        padding: 8px 14px;
    }
}
/* 小屏手机：强制搜索栏不换行，完美一行显示 */
@media (max-width: 480px) {
    .search-bar { flex-wrap: nowrap; }
    .shuffle-btn, .random-btn { padding: 8px 10px; font-size: 12px; }
    .search-input { font-size: 14px; padding: 8px 10px; }
    
    /* 小屏手机背景调整 */
    body {
        background-position-x: 80%;
    }
    
    /* 小屏手机文字大小优化 */
    .mobile-title {
        font-size: 15px;
    }
    .mobile-singer {
        font-size: 13px;
    }
    .mobile-category {
        font-size: 12px;
        min-width: 70px;
    }
    /* 小屏手机右上角按钮进一步适配 */
    .top-right-btn {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 6px 12px;
    }
}
/* ======================================================================== */
/* 付费标识小徽章 */
.badge-sc {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 6px;
  border-radius: 4px;
  background-color: #ffd700;
  color: #000;
  font-size: 12px;
  font-weight: bold;
  line-height: 1;
  white-space: nowrap;
}
</style>
</head>
<body>
<!-- 新版随机歌曲弹窗DOM（移除关闭按钮） -->
<div class="random-modal-mask" id="randomModal">
    <div class="random-modal-box">
        <!-- 歌名标题 -->
        <div class="modal-song-title" id="modalSongTitle"></div>
        <!-- 歌手 -->
        <div class="modal-singer-text" id="modalSingerText"></div>
        <!-- 语言+曲风+风格 三个标签 -->
        <div class="modal-tag-wrap" id="tagsContainer">
            <span class="modal-tag-item" id="tagLang"></span>
            <span class="modal-tag-item" id="tagGenre"></span>
            <span class="modal-tag-item" id="tagStyle"></span>
        </div>
        <!-- 底部两个按钮 -->
        <div class="modal-btn-group">
            <button class="modal-action-btn btn-copy-song" id="modalCopyBtn">复制歌名</button>
            <button class="modal-action-btn btn-re-random" id="modalReRandomBtn">重新随机</button>
        </div>
    </div>
</div>

<!-- 右上角按钮 -->
<button class="top-right-btn" onclick="window.open('https://qiyuanyuan.feishu.cn/wiki/ABozwohdai54eWkUhVfc49nLnCe?table=tblAyMnUJgpuWVqp&view=vewXxBNTOK','_blank')">前往路灯</button>
<!-- 气泡容器 -->
<div id="toast-container"></div>
<!-- 头部 -->
<div class="header">
    <img src="./e22a6dd351d3eb09e7f238e264fd06a2303246676.jpg@560w_560h_1e_1c.avif" alt="头像" class="avatar">
    <h1>栖苑太困辽 与她的</h1>
    <p id="song-count">0 首歌</p>
    <div class="update-info">last update: 2026-06-22</div>
</div>
<!-- 筛选 -->
<div class="filter-bar">
    <button class="filter-btn active" data-type="lang" data-val="all">全部语言</button>
    <button class="filter-btn" data-type="lang" data-val="中文">中文</button>
    <button class="filter-btn" data-type="lang" data-val="日文">日文</button>
    <button class="filter-btn" data-type="lang" data-val="英文">英文</button>
    <button class="filter-btn active" data-type="style" data-val="all">全部风格</button>
    <button class="filter-btn" data-type="style" data-val="甜歌">甜歌</button>
    <button class="filter-btn" data-type="style" data-val="苦情">苦情</button>
    <button class="filter-btn active" data-type="qufeng" data-val="all">全部曲风</button>
    <button class="filter-btn" data-type="qufeng" data-val="流行">流行</button>
    <button class="filter-btn" data-type="qufeng" data-val="国风">国风</button>
</div>
<!-- 搜索 -->
<div class="search-bar">
    <button class="shuffle-btn">打乱顺序</button>
    <input class="search-input" placeholder="搜索歌名/歌手">
    <button class="random-btn">随机一首</button>
</div>
<!-- 歌单列表 -->
<div class="list-container">
    <table class="song-list">
        <thead>
            <!-- PC端表头：序号-歌名-歌手-类别 -->
            <tr><th>#</th><th>歌名</th><th>歌手</th><th>类别</th></tr>
        </thead>
        <tbody id="list"></tbody>
    </table>
</div>
<script>
// 随机背景图片数组
const bgList = [
    "bgi-w-idol.jpg",
    "bgi-w-witch.jpg"
];
// 随机选择一张并设置背景，分开赋值防止覆盖background-size
function setRandomBg() {
    const randomImg = bgList[Math.floor(Math.random() * bgList.length)];
    const winWidth = window.innerWidth;
    let posX;

    if (randomImg === "bgi-w-idol.jpg") {
        if (winWidth <= 480) posX = "80%";
        else if (winWidth <= 768) posX = "70%";
        else posX = "center";
    } else {
        // bgi-w-witch：PC居中，平板15%，小屏10%
        if (winWidth <= 480) posX = "10%";
        else if (winWidth <= 768) posX = "15%";
        else posX = "center";
    }

    // 分开设置图片与位置，不覆盖background-size
    document.body.style.backgroundImage = `url(${randomImg})`;
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundAttachment = "fixed";
    document.body.style.backgroundPosition = posX;
}
// 页面载入执行
setRandomBg();
// 窗口缩放自动重算位置
window.addEventListener('resize', setRandomBg);
let allSongs = [];
let filtered = [];
let page = 1;
const size = 20;
// 当前弹窗内选中的歌曲对象
let currentRandomSong = null;
// ========== 绿色堆叠气泡提示 ==========
function showToast(msg, isError = false) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast-item';
    toast.textContent = msg;
    if (isError) toast.classList.add('error');
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
// 渲染歌曲 - 适配PC端四列和移动端两行样式
// ====================== 【可配置列表】以后在这里加歌名 ======================
const paidSongList = [
  "撞地球",
  "枫叶城",
  "免我蹉跎苦"
];
// 从同级 songs.json 加载歌曲数据
async function loadSongJson() {
    try {
        const res = await fetch('./songs.json');
        if (!res.ok) throw new Error('文件不存在或读取失败');
        allSongs = await res.json();
        filtered = [...allSongs];
        render();
    } catch (err) {
        console.error('加载歌单失败：', err);
        showToast('歌单文件加载失败，请检查songs.json', true);
    }
}
// ==========================================================================
function render() {
  const list = filtered.slice((page - 1) * size, page * size);
  const html = list.map((item, i) => {
    const index = page * size - size + i + 1;
    const category = `${item.lang}·${item.genre}${item.style ? '/' + item.style : ''}`;
    // 判断是否显示徽章
    const showBadge = paidSongList.includes(item.title);
    return `
      <tr class="pc-row" onclick="copyThis(${page * size - size + i})">
        <td>${index}</td>
        <td>
          ${item.title}
          ${showBadge ? '<span class="badge-sc">SC ¥30</span>' : ''}
        </td>
        <td>${item.singer}</td>
        <td>${category}</td>
      </tr>
      <tr class="mobile-row" onclick="copyThis(${page * size - size + i})">
        <td colspan="4">
          <div class="mobile-left">
            <span class="mobile-index">#${index}</span>
            <div class="mobile-title-wrap">
              <div class="mobile-title">
                ${item.title}
                ${showBadge ? '<span class="badge-sc" style="font-size:10px; padding:1px 4px;">SC ¥30</span>' : ''}
              </div>
              <div class="mobile-singer">${item.singer}</div>
            </div>
          </div>
          <span class="mobile-category">${category}</span>
        </td>
      </tr>
    `;
  }).join('');
  page === 1 ? document.getElementById('list').innerHTML = html : document.getElementById('list').innerHTML += html;
  document.getElementById('song-count').innerText = filtered.length + ' 首歌';
}
// 点击整行复制
function copyThis(index) {
    const item = filtered[index];
    const text = `点歌 ${item.title} ${item.singer}`;
    navigator.clipboard.writeText(text).then(() => {
        showToast(`已复制：${text}`);
    }).catch(() => {
        showToast('复制失败，请手动复制', true);
    });
}

// 弹窗DOM元素绑定（移除关闭按钮）
const randomModal = document.getElementById('randomModal');
const modalSongTitle = document.getElementById('modalSongTitle');
const modalSingerText = document.getElementById('modalSingerText');
const tagLang = document.getElementById('tagLang');
const tagGenre = document.getElementById('tagGenre');
const tagStyle = document.getElementById('tagStyle');
const modalCopyBtn = document.getElementById('modalCopyBtn');
const modalReRandomBtn = document.getElementById('modalReRandomBtn');

// 刷新随机歌曲、填充弹窗所有内容
function refreshRandomSong() {
    if (filtered.length === 0) {
        showToast('暂无可播放歌曲', true);
        randomModal.classList.remove('show');
        return;
    }
    // 随机抽取筛选后的歌曲
    currentRandomSong = filtered[Math.floor(Math.random() * filtered.length)];
    const isPaid = paidSongList.includes(currentRandomSong.title);

    // 填充歌名+付费徽章
    let titleHtml = currentRandomSong.title;
    if(isPaid) titleHtml += `<span class="modal-title-badge">SC ¥30</span>`;
    modalSongTitle.innerHTML = titleHtml;

    // 填充歌手
    modalSingerText.textContent = `歌手：${currentRandomSong.singer}`;

    // 基础两个标签必显示
    tagLang.textContent = currentRandomSong.lang;
    tagGenre.textContent = currentRandomSong.genre;

    // 风格为空则隐藏标签，有内容才展示
    if(currentRandomSong.style && currentRandomSong.style.trim() !== ''){
        tagStyle.textContent = currentRandomSong.style;
        tagStyle.style.display = 'inline-block';
    }else{
        tagStyle.style.display = 'none';
    }
}

// 打开弹窗
function openRandomModal(){
    refreshRandomSong();
    randomModal.classList.add('show');
}

// 复制歌名
function copyModalSong(){
    if(!currentRandomSong) return;
    const copyText = `点歌 ${currentRandomSong.title} - ${currentRandomSong.singer}`;
    navigator.clipboard.writeText(copyText).then(()=>{
        showToast(`已复制：${copyText}`);
    }).catch(()=>{
        showToast('复制失败，请手动复制文本', true);
    });
}

// 绑定所有点击事件
modalCopyBtn.onclick = copyModalSong;
modalReRandomBtn.onclick = refreshRandomSong;
// 点击黑色遮罩空白区域关闭弹窗
randomModal.onclick = function(e){
    if(e.target === randomModal){
        randomModal.classList.remove('show');
    }
}

// 随机一首按钮绑定打开弹窗
document.querySelector('.random-btn').onclick = openRandomModal;

// 筛选
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(`.filter-btn[data-type="${btn.dataset.type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        doFilter();
    };
});
function doFilter() {
    const lang = document.querySelector('.filter-btn[data-type="lang"].active')?.dataset.val || 'all';
    const style = document.querySelector('.filter-btn[data-type="style"].active')?.dataset.val || 'all';
    const qufeng = document.querySelector('.filter-btn[data-type="qufeng"].active')?.dataset.val || 'all';
    const kw = document.querySelector('.search-input').value.toLowerCase();
    filtered = allSongs.filter(s => {
        if (lang !== 'all' && s.lang !== lang) return false;
        if (style !== 'all' && s.style !== style) return false;
        if (qufeng !== 'all' && s.genre !== qufeng) return false;
        if (kw && !`${s.title}${s.singer}`.toLowerCase().includes(kw)) return false;
        return true;
    });
    page = 1;
    render();
}
// 搜索
document.querySelector('.search-input').oninput = doFilter;
// 打乱
document.querySelector('.shuffle-btn').onclick = () => {
    filtered.sort(() => Math.random() - 0.5);
    page = 1;
    render();
};
// 滚动加载
document.querySelector('.list-container').onscroll = function () {
    const el = this;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 30) {
        if (page * size < filtered.length) {
            page++;
            render();
        }
    }
};
// 初始化加载本地js歌单文件（支持双击打开本地html）
loadSongJson();
</script>
</body>
</html>
