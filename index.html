<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栖苑歌单</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<style>
/* 全局样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
/* 背景 - 优化移动端背景展示 */
body {
    background-size: cover;
    color: #fff;
    position: relative;
}
/* 背景遮罩 */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 80, 200, 0.6);
    z-index: -1;
}
/* ========== 右上角按钮 现代化胶囊发光优化 ========== */
.top-right-btn {
    position: fixed;
    top: 25px; 
    right: 15%; 
    z-index: 998;
    padding: 10px 24px;
    border: 1px solid rgba(255,255,0.8);
    border-radius: 20px;
    background: linear-gradient(135deg, #db2777, #ec4899);
    color: #fff;
    font-weight: 600;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.22s ease;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.2),
        0 0 16px rgba(236,72,153,0.5),
        inset 0 0 10px rgba(255,255,255,0.15);
}
.top-right-btn:hover {
    background: linear-gradient(135deg, #be185d, #db2777);
    transform: translateY(-2px) scale(1.04);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.35),
        0 0 22px rgba(236,72,153,0.7),
        inset 0 0 16px rgba(255,255,255,0.22);
}
.top-right-btn:active {
    transform: translateY(-1px) scale(1.01);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.25),
        0 0 10px rgba(236,72,153,0.55),
        inset 0 0 6px rgba(0,0,0,0.1);
}
/* ========== 新增：个人空间/直播间按钮栏样式 ========== */
.user-link-bar {
    width: 70%;
    margin: 0 auto 16px;
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
}
.user-link-btn {
    padding: 12px 28px;
    border: 1px solid rgba(255, 255, 0.85);
    border-radius: 20px;
    background: linear-gradient(135deg, #6b21a8, #8b5cf6);
    color: #fff;
    cursor: pointer;
    transition: all 0.22s ease;
    font-size: 16px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 18px rgba(139, 92, 246, 0.55),
        inset 0 0 12px rgba(255, 255, 255, 0.16);
    text-decoration: none;
    white-space: nowrap;
}
.user-link-btn .btn-icon {
    width: 18px;
    height: 18px;
    stroke-width: 2.3;
    opacity: 0.92;
}
.user-link-btn:hover {
    transform: translateY(-3px) scale(1.05);
    background: linear-gradient(135deg, #581c87, #7c3aed);
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 0 24px rgba(139, 92, 246, 0.75),
        inset 0 0 18px rgba(255, 255, 255, 0.24);
}
.user-link-btn:active {
    transform: translateY(-1px) scale(1.02);
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.25),
        0 0 12px rgba(139, 92, 246, 0.6),
        inset 0 0 8px rgba(0, 0, 0, 0.12);
}
.user-link-btn.live {
    background: linear-gradient(135deg, #ec4899, #f472b6);
    border-color: rgba(255, 255, 255, 0.85);
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 18px rgba(236, 72, 153, 0.55),
        inset 0 0 12px rgba(255, 255, 255, 0.16);
}
.user-link-btn.live:hover {
    background: linear-gradient(135deg, #db2777, #ec4899);
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 0 24px rgba(236, 72, 153, 0.75),
        inset 0 0 18px rgba(255, 255, 255, 0.24);
}
.user-link-btn.live:active {
    transform: translateY(-1px) scale(1.02);
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.25),
        0 0 12px rgba(236, 72, 153, 0.6),
        inset 0 0 8px rgba(0, 0, 0, 0.12);
}
/* ========== 右上角堆叠气泡提示框 ========== */
#toast-container {
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast-item {
    padding: 12px 20px;
    background: rgba(76, 175, 80, 0.9);
    color: #fff;
    border-radius: 6px;
    font-size: 14px;
    min-width: 220px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateX(120%);
    transition: all 0.3s ease;
    pointer-events: none;
}
.toast-item.show {
    opacity: 1;
    transform: translateX(0);
}
.toast-item.error {
    background: rgba(244, 67, 54, 0.9);
}
/* ========== 头部布局【PC专用配置】 ========== */
.header {
    width: 70%;
    margin: 0 auto 20px;
    padding: 40px 0 15px 0; /* 上40px 下15px */
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
}
/* 头像容器禁止压缩 */
.header-avatar-wrap {
    flex-shrink: 0;
}
/* PC文字居中对齐 */
.header-text-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: center;
}
/* 头像恢复256px原始尺寸 */
.avatar-link {
    display: inline-block;
    text-decoration: none;
}
.avatar {
    width: 256px;
    height: 256px;
    border-radius: 50%;
    border: 4px solid #fff;
    transition: transform 0.3s ease;
}
.avatar-link:hover .avatar {
    transform: scale(1.05);
}
.header h1 {
    font-size: 28px;
    color: #ff99cc;
    margin: 0;
}
.header p {
    font-size: 20px;
    color: #e0c0ff;
    margin: 0;
}
.update-info {
    font-size: 14px;
    color: #ccc;
}
/* ========== PC端筛选栏（原始样式保留） ========== */
.filter-bar {
    width: 70%;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
}
/* 移动端分组容器 默认隐藏 */
.filter-group-mobile {
    display: none;
    width: 95%;
    margin: 0 auto 20px;
}
.filter-group {
    margin-bottom: 14px;
}
.filter-group-title {
    font-size: 15px;
    color: #ffd8f0;
    margin-bottom: 8px;
}
.filter-group-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-start; /* 左对齐 */
}
.filter-btn {
    padding: 14px 32px;
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: 20px;
    background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    color: #fff;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.22s ease;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.15),
        0 0 12px rgba(139,92,246,0.4),
        inset 0 0 8px rgba(255,255,255,0.12);
}
.filter-btn:hover {
    transform: translateY(-2px) scale(1.04);
    background: linear-gradient(135deg, #7c3aed, #8b5cf6);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.3),
        0 0 18px rgba(139,92,246,0.6),
        inset 0 0 14px rgba(255,255,255,0.2);
}
.filter-btn.active {
    background: linear-gradient(135deg, #5b21b6, #7c3aed);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.4),
        0 0 22px rgba(139,92,246,0.75),
        inset 0 0 16px rgba(255,255,255,0.24);
    transform: scale(1.04);
}
.filter-btn:active {
    transform: translateY(-1px) scale(1.01);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.2),
        0 0 8px rgba(139,92,246,0.45),
        inset 0 0 4px rgba(0,0,0,0.1);
}
/* ========== 搜索区打乱、随机按钮 统一粉色发光胶囊 ========== */
.search-bar {
    width: 70%;
    margin: 0 auto 20px;
    display: flex;
    gap: 12px;
}
.shuffle-btn, .random-btn {
    padding: 10px 20px;
    border: 1px solid rgba(255,255,0.8);
    border-radius: 20px;
    background: linear-gradient(135deg, #ec4899, #f472b6);
    color: #fff;
    font-weight: 500;
    font-size: 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.22s ease;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.18),
        0 0 12px rgba(236,72,153,0.45),
        inset 0 0 8px rgba(255,255,255,0.12);
}
.shuffle-btn:hover, .random-btn:hover {
    background: linear-gradient(135deg, #db2777, #ec4899);
    transform: translateY(-2px) scale(1.04);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.32),
        0 0 18px rgba(236,72,153,0.65),
        inset 0 0 14px rgba(255,255,255,0.2);
}
.shuffle-btn:active, .random-btn:active {
    transform: translateY(-1px) scale(1.01);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.22),
        0 0 8px rgba(236,72,153,0.5),
        inset 0 0 4px rgba(0,0,0,0.1);
}
.search-input {
    flex: 1;
    padding: 10px 15px;
    border: 2px solid #d1c4e9;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    font-size: 16px;
    min-width: 0;
    transition: border 0.25s ease, box-shadow 0.25s ease;
}
.search-input:focus {
    outline: none;
    border-color: #b388ff;
    box-shadow: 0 0 14px rgba(139,92,246,0.4);
}
.search-input::placeholder {
    color: #e0e0e0;
}
/* ========== Div歌单容器样式 完全替换table ========== */
.list-container {
    width: 70%;
    margin: 0 auto;
    max-height: 700px;
    overflow-y: auto;
    overflow-x: hidden;
    border-radius: 10px;
    background: rgba(100, 60, 180, 0.5);
    padding: 10px;
}
/* 自定义滚动条 */
.list-container::-webkit-scrollbar {
    width: 8px;
}
.list-container::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
}
.list-container::-webkit-scrollbar-thumb {
    background: #b388ff;
    border-radius: 4px;
}
/* 列表外层容器 */
.song-list-wrap {
    display: flex;
    flex-direction: column;
}
/* PC表头行 */
.song-header-pc {
    display: flex;
    align-items: center;
    padding: 12px 8px;
    border-radius: 12px;
    color: #ff99cc;
    font-weight: bold;
}
/* PC歌曲行 */
.song-row-pc {
    display: flex;
    align-items: center;
    padding: 12px 8px;
    border-radius: 12px;
    transition: all 0.2s ease;
    cursor: pointer;
    transform-origin: center;
    overflow: hidden;
	line-height: 32px;
}
/* PC悬浮样式 */
.song-row-pc:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: scale(1.01);
    border-radius: 14px;
    box-shadow: 0 0 10px rgba(255,153,204,0.3);
}
.song-row-pc:hover .col-title {
    color: #ff99cc !important;
    font-weight: 600;
}
/* PC列宽比例 与原表格一致 # : 40%歌名 :40%歌手 :15%分类 */
.col-index { width: 5%; white-space: nowrap; padding-right: 8px; }
.col-title { width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.col-singer { width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.col-cate { width: 15%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }

/* 移动端单行样式 */
.song-row-mobile {
    display: none;
    padding: 15px 10px;
    border-radius: 12px;
    transition: all 0.2s ease;
    cursor: pointer;
    transform-origin: center;
    overflow: hidden;
    justify-content: space-between;
    align-items: flex-start;
}
.song-row-mobile:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: scale(1.015);
    border-radius: 14px;
    box-shadow: 0 0 10px rgba(255,153,204,0.3);
}
.song-row-mobile:hover .mobile-title {
    color: #ff99cc !important;
    font-weight: bold;
}
.mobile-left {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex: 1;
}
.mobile-index {
    color: #ff99cc;
    font-weight: bold;
    font-size: 14px;
    min-width: 20px;
    margin-top: 2px;
}
.mobile-title-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.mobile-title {
    font-size: 16px;
    font-weight: bold;
    transition: color 0.2s ease;
}
.mobile-singer {
    font-size: 14px;
    color: #ccc;
}
.mobile-category {
    color: #e0c0ff;
    font-size: 13px;
    text-align: right;
    min-width: 80px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
}
/* ========== 改版紧凑半透明弹窗 ========== */
.random-modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.random-modal-mask.show {
    display: flex;
}
.random-modal-box {
    width: 800px;
    max-width: 100%;
    background: rgba(110, 70, 190, 0.72);
    border-radius: 20px;
    padding: 22px 22px;
    position: relative;
    box-shadow: 0 6px 26px rgba(0,0,0,0.25);
}
.modal-song-title {
    font-size: 34px;
    font-weight: bold;
    color: #ffffff;
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.2;
}
.modal-title-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 7px;
    border-radius: 6px;
    background-color: #ffd700;
    color: #000;
    font-size: 13px;
    font-weight: bold;
    vertical-align: middle;
}
.modal-singer-text {
    font-size: 17px;
    color: #e8d8ff;
    text-align: center;
    margin-bottom: 14px;
}
.modal-tag-wrap {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.modal-tag-item {
    padding: 5px 14px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    color: #fff;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
}
/* ========== 弹窗底部按钮 发光胶囊优化 ========== */
.modal-btn-group {
    display: flex;
    gap: 30px;
}
.modal-action-btn {
    flex: 1;
    padding: 11px 0;
    border: 1px solid rgba(255,255,0.8);
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.22s ease;
}
.btn-copy-song {
    background: linear-gradient(135deg, #16a34a, #4ade80);
    color: #fff;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.18),
        0 0 12px rgba(74,222,128,0.45),
        inset 0 0 8px rgba(255,255,255,0.12);
}
.btn-copy-song:hover {
    background: linear-gradient(135deg, #15803d, #16a34a);
    transform: translateY(-2px) scale(1.03);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.32),
        0 0 18px rgba(74,222,128,0.65),
        inset 0 0 14px rgba(255,255,255,0.2);
}
.btn-re-random {
    background: linear-gradient(135deg, #ec4899, #f472b6);
    color: #fff;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.18),
        0 0 12px rgba(236,72,153,0.45),
        inset 0 0 8px rgba(255,255,255,0.12);
}
.btn-re-random:hover {
    background: linear-gradient(135deg, #db2777, #ec4899);
    transform: translateY(-2px) scale(1.03);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.32),
        0 0 18px rgba(236,72,153,0.65),
        inset 0 0 14px rgba(255,255,255,0.2);
}
.modal-action-btn:active {
    transform: translateY(-1px) scale(1.01);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.22),
        0 0 8px rgba(0,0,0,0.2),
        inset 0 0 4px rgba(0,0,0,0.1);
}
/* ========== 移动端768px以下专属筛选栏切换 ========== */
@media (max-width: 768px) {
    body {
        background: url('./bgi-w-idol.jpg') no-repeat right center fixed;
        background-size: cover;
        background-position-x: 70%;
    }
    /* 头部改为垂直上下 */
    .header {
        width: 95%;
        flex-direction: column;
        text-align: center;
        gap: 8px;
        padding: 16px 0 0 0;
		margin-bottom: 10px;
    }
    .header-text-wrap {
        align-items: center;
        gap: 2px;
    }
    .avatar {
        width: 140px;
        height: 140px;
    }
    .header h1 { font-size: 22px; }
    .header p { font-size: 16px; }

    /* 隐藏PC一行筛选栏，显示分组三排筛选 */
    .filter-bar {
        display: none;
    }
    .filter-group-mobile {
        display: block;
    }
    .filter-btn {
        padding: 10px 20px;
        font-size: 14px;
    }

    .user-link-bar { width: 95%; }
    .search-bar { width: 95%; }
    .shuffle-btn, .random-btn { padding: 10px 12px; font-size: 14px; }
    
    .list-container { width: 95%; max-height: 480px; }
    
    /* 隐藏PC表头和PC行，展示移动端行 */
    .song-header-pc { display: none; }
    .song-row-pc { display: none; }
    .song-row-mobile { display: flex; }

    .mobile-title {
        font-size: 16px;
    }
    .mobile-singer {
        font-size: 14px;
        color: #ccc;
    }
    .mobile-category {
        color: #e0c0ff;
        font-size: 13px;
        min-width: 80px;
    }
    .top-right-btn {
        top: 15px;
        right: 15px;
        font-size: 18px;
        padding: 8px 20px;
    }
}
/* 小屏手机480px适配 */
@media (max-width: 480px) {
    .random-modal-box {
        padding: 18px 16px;
    }
    .modal-song-title {
        font-size: 26px;
        margin-bottom: 10px;
		height: 60px;
    }
    .modal-singer-text {
        font-size: 15px;
        margin-bottom: 12px;
    }
    .modal-tag-wrap {
        gap: 6px;
        margin-bottom: 18px;
    }
    .modal-tag-item {
        font-size: 12px;
        padding: 4px 10px;
    }
    .modal-action-btn {
        padding: 9px 0;
        font-size: 14px;
    }
    .modal-title-badge {
        font-size: 11px;
        padding: 2px 5px;
    }
    .user-link-btn {
		padding: 10px 20px;
		font-size: 15px;
	}
	.user-link-btn .btn-icon {
		width: 16px;
		height: 16px;
	}
    .top-right-btn {
        font-size: 16px;
        padding: 8px 18px;
    }
    .filter-btn {
        padding: 8px 16px;
        font-size: 13px;
    }
    .shuffle-btn, .random-btn {
        padding: 8px 12px;
        font-size: 14px;
    }
    .search-bar { flex-wrap: nowrap; }
    .shuffle-btn, .random-btn { padding: 8px 10px; font-size: 12px; }
    .search-input { font-size: 14px; padding: 8px 10px; }
    
    body {
        background-position-x: 80%;
    }
    
    .mobile-title {
        font-size: 15px;
    }
    .mobile-singer {
        font-size: 13px;
    }
    .mobile-category {
        font-size: 12px;
        min-width: 70px;
    }
    .top-right-btn {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 6px 16px;
    }
}
/* 付费标识小徽章 */
.badge-sc {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 6px;
  border-radius: 4px;
  background-color: #ffd700;
  color: #000;
  font-size: 12px;
  font-weight: bold;
  line-height: 1;
  white-space: nowrap;
}
</style>
</head>
<body>
<!-- 新版随机歌曲弹窗DOM（移除关闭按钮） -->
<div class="random-modal-mask" id="randomModal">
    <div class="random-modal-box">
        <div class="modal-song-title" id="modalSongTitle"></div>
        <div class="modal-singer-text" id="modalSingerText"></div>
        <div class="modal-tag-wrap" id="tagsContainer">
            <span class="modal-tag-item" id="tagLang"></span>
            <span class="modal-tag-item" id="tagGenre"></span>
            <span class="modal-tag-item" id="tagStyle"></span>
        </div>
        <div class="modal-btn-group">

<!-- 搜索 -->
<div class="search-bar">
    <button class="shuffle-btn">打乱顺序</button>

<!-- 歌单列表：完全DIV布局，移除table -->
 <div class="list-container">
    <div class="song-list-wrap" id="list"></div>
</div>
<script>
// 随机背景图片数组
const bgList = [
    "bgi-w-idol.jpg",
    "bgi-w-witch.jpg"
];
// 随机选择一张并设置背景，分开赋值防止覆盖background-size
function setRandomBg() {
    const randomImg = bgList[Math.floor(Math.random() * bgList.length)];
    const winWidth = window.innerWidth;
    let posX;

    if (randomImg === "bgi-w-idol.jpg") {
        if (winWidth <= 480) posX = "80%";
        else if (winWidth <= 768) posX = "70%";
        else posX = "center";
    } else {
        // bgi-w-witch：PC居中，平板15%，小屏10%
        if (winWidth <= 480) posX = "10%";
        else if (winWidth <= 768) posX = "15%";
        else posX = "center";
    }

    // 分开设置图片与位置，不覆盖background-size
    document.body.style.backgroundImage = `url(${randomImg})`;
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundAttachment = "fixed";
    document.body.style.backgroundPosition = posX;
}
// 页面载入执行
setRandomBg();
// 窗口缩放自动重算位置
window.addEventListener('resize', setRandomBg);

let allSongs = [];
let filtered = [];
let page = 1;
const size = 20;
// 当前弹窗内选中的歌曲对象
let currentRandomSong = null;
// ========== 绿色堆叠气泡提示 ==========
function showToast(msg, isError = false) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast-item';
    toast.textContent = msg;
    if (isError) toast.classList.add('error');
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
// 渲染歌曲 - 适配PC端四列和移动端两行样式
// ====================== 【可配置列表】以后在这里加歌名 ======================
const paidSongList = [
  "撞地球",
  "枫叶城",
  "免我蹉跎苦"
];
// 从同级 songs.json 加载歌曲数据
async function loadSongJson() {
    try {
        const res = await fetch('./songs.json');
        if (!res.ok) throw new Error('文件不存在或读取失败');
        allSongs = await res.json();
        filtered = [...allSongs];
        render();
    } catch (err) {
        console.error('加载歌单失败：', err);
        showToast('歌单文件加载失败，请检查songs.json', true);
    }
}
// ====================== 渲染函数：纯DIV生成，无table ======================
function render() {
  const wrapEl = document.getElementById('list');
  const pageData = filtered.slice((page - 1) * size, page * size);
  let htmlStr = '';

  // 第一页绘制PC表头
  if(page === 1) {
    htmlStr += `
      <div class="song-header-pc">
        <div class="col-index">#</div>
        <div class="col-title">歌名</div>
        <div class="col-singer">歌手</div>
        <div class="col-cate">类别</div>
      </div>
    `;
  }

  // 循环生成每行歌曲DIV
  pageData.forEach((item, i) => {
    const index = page * size - size + i + 1;
    const category = `${item.lang}·${item.genre}${item.style ? '/' + item.style : ''}`;
    const showBadge = paidSongList.includes(item.title) || (item.sc && item.sc.trim() !== '');
    const scVal = item.sc?.trim() || "30";
    const badgeText = `SC ¥${scVal}`;
    const badgeHtml = showBadge ? `<span class="badge-sc">${badgeText}</span>` : '';
    const mobileBadge = showBadge ? `<span class="badge-sc" style="font-size:10px; padding:1px 4px;">${badgeText}</span>` : '';

    // PC端行
    htmlStr += `
      <div class="song-row-pc" onclick="copyThis(${page * size - size + i})">
        <div class="col-index">${index}</div>
        <div class="col-title">${item.title}${badgeHtml}</div>
        <div class="col-singer">${item.singer}</div>
        <div class="col-cate">${category}</div>
      </div>
    `;
    // 移动端行
    htmlStr += `
      <div class="song-row-mobile" onclick="copyThis(${page * size - size + i})">
        <div class="mobile-left">
          <span class="mobile-index">#${index}</span>
          <div class="mobile-title-wrap">
            <div class="mobile-title">${item.title}${mobileBadge}</div>
            <div class="mobile-singer">${item.singer}</div>
          </div>
        </div>
        <span class="mobile-category">${category}</span>
      </div>
    `;
  });

  // 追加或覆盖页面
  if(page === 1) wrapEl.innerHTML = htmlStr;
  else wrapEl.innerHTML += htmlStr;
  document.getElementById('song-count').innerText = filtered.length + ' 首歌';
}
// 点击整行复制
function copyThis(index) {
    const item = filtered[index];
    const text = `点歌 ${item.title} ${item.singer}`;
    navigator.clipboard.writeText(text).then(() => {
        showToast(`已复制：${text}`);
    }).catch(() => {
        showToast('复制失败，请手动复制', true);
    });
}

// 弹窗DOM元素绑定（移除关闭按钮）
const randomModal = document.getElementById('randomModal');
const modalSongTitle = document.getElementById('modalSongTitle');
const modalSingerText = document.getElementById('modalSingerText');
const tagLang = document.getElementById('tagLang');
const tagGenre = document.getElementById('tagGenre');
const tagStyle = document.getElementById('tagStyle');
const modalCopyBtn = document.getElementById('modalCopyBtn');
const modalReRandomBtn = document.getElementById('modalReRandomBtn');

// 刷新随机歌曲、填充弹窗所有内容
function refreshRandomSong() {
    if (filtered.length === 0) {
        showToast('暂无可播放歌曲', true);
        randomModal.classList.remove('show');
        return;
    }
    // 随机抽取筛选后的歌曲
    currentRandomSong = filtered[Math.floor(Math.random() * filtered.length)];
    const isPaid = paidSongList.includes(currentRandomSong.title) || (currentRandomSong.sc && currentRandomSong.sc.trim() !== '');
    // sc兜底30
    const scVal = currentRandomSong.sc?.trim() || "30";
    const modalBadgeText = `SC ¥${scVal}`;
    // 填充歌名+动态付费徽章
    let titleHtml = currentRandomSong.title;
    if(isPaid) {
        titleHtml += `<span class="modal-title-badge">${modalBadgeText}</span>`;
    }
    modalSongTitle.innerHTML = titleHtml;

    // 填充歌手
    modalSingerText.textContent = `歌手：${currentRandomSong.singer}`;

    // 基础两个标签必显示
    tagLang.textContent = currentRandomSong.lang;
    tagGenre.textContent = currentRandomSong.genre;

    // 风格为空则隐藏标签，有内容才展示
    if(currentRandomSong.style && currentRandomSong.style.trim() !== ''){
        tagStyle.textContent = currentRandomSong.style;
        tagStyle.style.display = 'inline-block';
    }else{
        tagStyle.style.display = 'none';
    }
    randomModal.classList.add('show');
}

// 打开弹窗
function openRandomModal(){
    refreshRandomSong();
}

// 复制歌名
function copyModalSong(){
    if(!currentRandomSong) return;
    const copyText = `点歌 ${currentRandomSong.title} - ${currentRandomSong.singer}`;
    navigator.clipboard.writeText(copyText).then(()=>{
        showToast(`已复制：${copyText}`);
    }).catch(()=>{
        showToast('复制失败，请手动复制文本', true);
    });
}

// 绑定所有点击事件
modalCopyBtn.onclick = copyModalSong;
modalReRandomBtn.onclick = refreshRandomSong;
// 点击黑色遮罩空白区域关闭弹窗
randomModal.onclick = function(e){
    if(e.target === randomModal){
        randomModal.classList.remove('show');
    }
}

// 随机一首按钮绑定打开弹窗
document.querySelector('.random-btn').onclick = openRandomModal;

// 筛选
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(`.filter-btn[data-type="${btn.dataset.type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        doFilter();
    };
});
function doFilter() {
    const lang = document.querySelector('.filter-btn[data-type="lang"].active')?.dataset.val || 'all';
    const style = document.querySelector('.filter-btn[data-type="style"].active')?.dataset.val || 'all';
    const qufeng = document.querySelector('.filter-btn[data-type="qufeng"].active')?.dataset.val || 'all';
    const kw = document.querySelector('.search-input').value.toLowerCase();
    filtered = allSongs.filter(s => {
        if (lang !== 'all' && s.lang !== lang) return false;
        if (style !== 'all' && s.style !== style) return false;
        if (qufeng !== 'all' && s.genre !== qufeng) return false;
        if (kw && !`${s.title}${s.singer}`.toLowerCase().includes(kw)) return false;
        return true;
    });
    page = 1;
    render();
}
// 搜索
document.querySelector('.search-input').oninput = doFilter;
// 打乱
document.querySelector('.shuffle-btn').onclick = () => {
    filtered.sort(() => Math.random() - 0.5);
    page = 1;
    render();
};
// 滚动加载
document.querySelector('.list-container').onscroll = function () {
    const el = this;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 30) {
        if (page * size < filtered.length) {
            page++;
            render();
        }
    }
};
// 初始化加载本地js歌单文件（支持双击打开本地html）
loadSongJson();
</script>
</body>
