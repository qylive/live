<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栖苑歌单</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<style>
/* 全局样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}

/* 背景 - 优化移动端背景展示 */
body {
    /* PC端正常居中显示 */
    background: url('./bgi-w-idol.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    position: relative;
}

/* 背景遮罩 */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 80, 200, 0.6);
    z-index: -1;
}

/* 右上角按钮 - 核心调整：仅修改定位参数，保留原有样式 */
.top-right-btn {
    position: fixed;
    /* 调整PC端位置：向右微调，向下微调，避免过于贴边 */
    top: 25px; 
    right: 15%; 
    z-index: 998;
    padding: 10px 18px;
    background: #e955a7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.top-right-btn:hover {
    background: #d645a7;
}

/* ========== 右上角堆叠气泡提示框 ========== */
#toast-container {
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast-item {
    padding: 12px 20px;
    background: rgba(76, 175, 80, 0.9);
    color: #fff;
    border-radius: 6px;
    font-size: 14px;
    min-width: 220px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateX(120%);
    transition: all 0.3s ease;
    pointer-events: none;
}
.toast-item.show {
    opacity: 1;
    transform: translateX(0);
}
.toast-item.error {
    background: rgba(244, 67, 54, 0.9);
}
/* ======================================== */

/* 头部信息 */
.header {
    text-align: center;
    padding: 40px 0;
}
.avatar {
    width: 256px;
    height: 256px;
    border-radius: 50%;
    border: 4px solid #fff;
    margin-bottom: 20px;
}
.header h1 {
    font-size: 28px;
    color: #ff99cc;
    margin-bottom: 10px;
}
.header p {
    font-size: 20px;
    color: #e0c0ff;
    margin-bottom: 10px;
}
.update-info {
    font-size: 14px;
    color: #ccc;
}

/* 筛选栏 - 保留原有70%宽度，不修改 */
.filter-bar {
    width: 70%;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
}
.filter-btn {
    padding: 18px 48px;
    border: none;
    border-radius: 20px;
    background: #b388ff;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
}
.filter-btn:hover, .filter-btn.active {
    background: #805acb;
    transform: scale(1.05);
}

/* 搜索和功能按钮 - 保留原有70%宽度，不修改 */
.search-bar {
    width: 70%;
    margin: 0 auto 20px;
    display: flex;
    gap: 10px;
}
.shuffle-btn, .random-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #ff80ab;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    white-space: nowrap;
}
.shuffle-btn:hover, .random-btn:hover {
    background: #f50057;
}
.search-input {
    flex: 1;
    padding: 10px 15px;
    border: 2px solid #d1c4e9;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    font-size: 16px;
    min-width: 0;
}
.search-input::placeholder {
    color: #e0e0e0;
}

/* 列表容器 - 保留原有70%宽度和高度，不修改 */
.list-container {
    width: 70%;
    margin: 0 auto;
    max-height: 600px;
    overflow-y: auto;
    border-radius: 10px;
    background: rgba(100, 60, 180, 0.5);
    padding: 10px;
}
/* 自定义滚动条 */
.list-container::-webkit-scrollbar {
    width: 8px;
}
.list-container::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
}
.list-container::-webkit-scrollbar-thumb {
    background: #b388ff;
    border-radius: 4px;
}

/* 列表表头和行 - PC端四列样式 */
.song-list {
    width: 100%;
    border-collapse: collapse;
}
.song-list th, .song-list td {
    padding: 12px 8px;
    text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}
.song-list th {
    color: #ff99cc;
    font-weight: bold;
}
/* 表格列宽比例：歌名:歌手:类别 = 4:4:1.5 */
.song-list th:nth-child(2),
.song-list td:nth-child(2) {
  width: 40%;
}
.song-list th:nth-child(3),
.song-list td:nth-child(3) {
  width: 40%;
}
.song-list th:nth-child(4),
.song-list td:nth-child(4) {
  width: 15%;
}
/* 序号列自动占剩余 */
.song-list th:nth-child(1),
.song-list td:nth-child(1) {
  width: auto;
  white-space: nowrap;
}
/* PC端行样式 */
.pc-row {
    display: table-row;
	line-height: 32px;
}
.song-list tr:hover {
    background: rgba(255, 255, 255, 0.1);
    cursor: pointer;
}
/* 移动端行容器（默认隐藏） */
.mobile-row {
    display: none;
}

/* ===================== 移动端优雅适配 ===================== */
@media (max-width: 768px) {
    /* 移动端背景调整：显示右侧30%内容 */
    body {
        background: url('./bgi-w-idol.jpg') no-repeat right center fixed;
        background-size: cover;
        /* 关键：将背景定位到右侧，只展示右边30% */
        background-position-x: 70%;
    }

    .header { padding: 20px 0; }
    .avatar { width: 160px; height: 160px; }
    .header h1 { font-size: 22px; }
    .header p { font-size: 16px; }
    
    .filter-bar { width: 95%; }
    .filter-btn { padding: 10px 20px; font-size: 14px; }
    
    .search-bar { width: 95%; }
    .shuffle-btn, .random-btn { padding: 10px 12px; font-size: 14px; }
    
    .list-container { width: 95%; max-height: 480px; }
    
    /* 移动端表格样式重置 */
    .song-list thead {
        display: none;
    }
    /* 隐藏PC端行，显示移动端行 */
    .pc-row {
        display: none;
    }
    .mobile-row {
        display: table-row;
    }
    .mobile-row > td {
        padding: 15px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    /* 移动端左侧内容（序号+标题+歌手） */
    .mobile-left {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex: 1;
    }
    /* 移动端序号 */
    .mobile-index {
        color: #ff99cc;
        font-weight: bold;
        font-size: 14px;
        min-width: 20px;
        margin-top: 2px;
    }
    /* 移动端标题歌手容器 */
    .mobile-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    /* 移动端歌名和歌手 */
    .mobile-title {
        font-size: 16px;
        font-weight: bold;
    }
    .mobile-singer {
        font-size: 14px;
        color: #ccc;
    }
    /* 移动端右侧类别 */
    .mobile-category {
        color: #e0c0ff;
        font-size: 13px;
        text-align: right;
        min-width: 80px;
        /* 确保类别垂直居中 */
        display: flex;
        align-items: center;
        justify-content: flex-end;
    }
    /* 移动端行hover效果 */
    .mobile-row:hover > td {
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
    }

    /* 移动端右上角按钮适配 */
    .top-right-btn {
        top: 15px;
        right: 15px;
        font-size: 18px;
        padding: 8px 14px;
    }
}

/* 小屏手机：强制搜索栏不换行，完美一行显示 */
@media (max-width: 480px) {
    .search-bar { flex-wrap: nowrap; }
    .shuffle-btn, .random-btn { padding: 8px 10px; font-size: 12px; }
    .search-input { font-size: 14px; padding: 8px 10px; }
    
    /* 小屏手机背景调整 */
    body {
        background-position-x: 80%;
    }
    
    /* 小屏手机文字大小优化 */
    .mobile-title {
        font-size: 15px;
    }
    .mobile-singer {
        font-size: 13px;
    }
    .mobile-category {
        font-size: 12px;
        min-width: 70px;
    }

    /* 小屏手机右上角按钮进一步适配 */
    .top-right-btn {
        top: 10px;
        right: 10px;
        font-size: 16px;
        padding: 6px 12px;
    }
}
/* ======================================================================== */
</style>
</head>

let filtered = [...allSongs];
let page = 1;
const size = 20;

// ========== 绿色堆叠气泡提示 ==========
function showToast(msg, isError = false) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast-item';
    toast.textContent = msg;
    if (isError) toast.classList.add('error');
    container.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 10);

    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// 渲染歌曲 - 适配PC端四列和移动端两行样式
function render() {
    const list = filtered.slice((page-1)*size, page*size);
    const html = list.map((item, i) => {
        const index = page*size-size + i + 1;
        // 拼接类别：语言·曲风/风格（风格为空则只显示语言·曲风）
        const category = `${item.lang} · ${item.genre}${item.style ? '/' + item.style : ''}`;
        
        return `
            <!-- PC端行：四列布局 -->
            <tr class="pc-row" onclick="copyThis(${page*size-size + i})">
                <td>${index}</td>
                <td>${item.title}</td>
                <td>${item.singer}</td>
                <td>${category}</td>
            </tr>
            <!-- 移动端行：左侧序号+标题+歌手，右侧类别 -->
            <tr class="mobile-row" onclick="copyThis(${page*size-size + i})">
                <td colspan="4">
                    <div class="mobile-left">
                        <span class="mobile-index">#${index}</span>
                        <div class="mobile-title-wrap">
                            <div class="mobile-title">${item.title}</div>
                            <div class="mobile-singer">${item.singer}</div>
                        </div>
                    </div>
                    <span class="mobile-category">${category}</span>
                </td>
            </tr>
        `;
    }).join('');
    
    page === 1 ? document.getElementById('list').innerHTML = html : document.getElementById('list').innerHTML += html;
    document.getElementById('song-count').innerText = filtered.length + ' 首歌';
}

// 点击整行复制
function copyThis(index) {
    const item = filtered[index];
    const text = `点歌 ${item.title} ${item.singer}`;
    navigator.clipboard.writeText(text).then(() => {
        showToast(`已复制：${text}`);
    }).catch(() => {
        showToast('复制失败，请手动复制', true);
    });
}

// 随机一首
document.querySelector('.random-btn').onclick = () => {
    if (filtered.length === 0) return showToast('暂无歌曲', true);
    const item = filtered[Math.floor(Math.random() * filtered.length)];
    const text = `点歌 ${item.title} ${item.singer}`;
    navigator.clipboard.writeText(text).then(() => {
        showToast(`随机已复制：${text}`);
    }).catch(() => {
        showToast('复制失败', true);
    });
};

// 筛选
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(`.filter-btn[data-type="${btn.dataset.type}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        doFilter();
    };
});

function doFilter() {
    const lang = document.querySelector('.filter-btn[data-type="lang"].active')?.dataset.val || 'all';
    const style = document.querySelector('.filter-btn[data-type="style"].active')?.dataset.val || 'all';
    const qufeng = document.querySelector('.filter-btn[data-type="qufeng"].active')?.dataset.val || 'all';
    const kw = document.querySelector('.search-input').value.toLowerCase();

    filtered = allSongs.filter(s => {
        if (lang !== 'all' && s.lang !== lang) return false;
        if (style !== 'all' && s.style !== style) return false;
        if (qufeng !== 'all' && s.genre !== qufeng) return false;
        if (kw && !`${s.title}${s.singer}`.toLowerCase().includes(kw)) return false;
        return true;
    });
    page = 1;
    render();
}

// 搜索
document.querySelector('.search-input').oninput = doFilter;

// 打乱
document.querySelector('.shuffle-btn').onclick = () => {
    filtered.sort(() => Math.random() - 0.5);
    page = 1;
    render();
};

// 滚动加载
document.querySelector('.list-container').onscroll = function () {
    const el = this;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 30) {
        if (page * size < filtered.length) {
            page++;
            render();
        }
    }
};

// 初始化
render();
</script>
