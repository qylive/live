<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>栖苑歌单</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="./style.css?v=7">
</head>
<body>
<!-- 欢迎动画遮罩：进入页面时暗化全屏，表情包+欢迎语弹入渐显，约1.8秒后淡出消失 -->
<div id="welcome-overlay">
    <div class="welcome-content">
        <svg class="welcome-emoji" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="苑小苑表情">
            <!-- 猫耳（后层） -->
            <path d="M60 52 L40 8 L94 34 Z" fill="#a975e8"/>
            <path d="M64 44 L52 22 L80 34 Z" fill="#f4a8d8"/>
            <path class="star" d="M64 30 L66 26 L70 28 L68 32 Z" fill="#ffd76e"/>
            <path d="M140 52 L160 8 L106 34 Z" fill="#a975e8"/>
            <path d="M136 44 L148 22 L120 34 Z" fill="#f4a8d8"/>
            <!-- 头顶蓬发 -->
            <path d="M100 12 C62 12 44 34 44 66 L44 78 C48 62 56 52 66 52 C74 34 84 24 100 24 C116 24 126 34 134 52 C144 52 152 62 156 78 L156 66 C156 34 138 12 100 12 Z" fill="#c9a6f5"/>
            <!-- 脸 -->
            <circle cx="100" cy="100" r="50" fill="#fff0ea"/>
            <!-- 刘海 -->
            <path d="M50 100 C50 78 150 78 150 100 C142 86 124 80 100 80 C76 80 58 86 50 100 Z" fill="#c9a6f5"/>
            <!-- 两侧发束 -->
            <path d="M52 94 C46 116 48 138 58 156 C62 148 64 134 66 118 Z" fill="#b57ff0"/>
            <path d="M148 94 C154 116 152 138 142 156 C138 148 136 134 134 118 Z" fill="#b57ff0"/>
            <!-- 闭眼微笑 -->
            <path d="M78 104 Q84 98 90 104" stroke="#5b4a8a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M110 104 Q116 98 122 104" stroke="#5b4a8a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- 腮红 -->
            <circle cx="74" cy="118" r="8" fill="#ffb3c6" opacity="0.75"/>
            <circle cx="126" cy="118" r="8" fill="#ffb3c6" opacity="0.75"/>
            <!-- 嘴 -->
            <path d="M92 126 Q100 132 108 126" stroke="#e0719e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <!-- 头顶星星 -->
            <path class="star" d="M100 14 L104 24 L114 28 L104 32 L100 42 L96 32 L86 28 L96 24 Z" fill="#ffd76e"/>
            <!-- 双手（爱心两侧） -->
            <circle cx="72" cy="202" r="10" fill="#fff0ea"/>
            <circle cx="128" cy="202" r="10" fill="#fff0ea"/>
            <!-- 中央大爱心 -->
            <path class="big-heart" d="M100 200 C86 186 66 196 66 210 C66 222 86 232 100 222 C114 232 134 222 134 210 C134 196 114 186 100 200 Z" fill="#ff5f8f"/>
            <!-- 两侧小爱心 -->
            <path class="mini-heart left" d="M40 128 C28 120 20 128 20 136 C20 144 34 152 40 144 C46 152 60 144 60 136 C60 128 52 120 40 128 Z" fill="#ff8fb3"/>
            <path class="mini-heart right" d="M160 128 C148 120 140 128 140 136 C140 144 154 152 160 144 C166 152 180 144 180 136 C180 128 172 120 160 128 Z" fill="#ff8fb3"/>
        </svg>
        <span class="welcome-spark s1"></span>
        <span class="welcome-spark s2"></span>
        <span class="welcome-spark s3"></span>
        <span class="welcome-spark s4"></span>
        <span class="welcome-spark s5"></span>
        <p class="welcome-text">欢迎来到苑小苑的歌单</p>
    </div>
</div>
<!-- 随机歌曲弹窗 -->
<div class="random-modal-mask" id="randomModal">
    <div class="random-modal-box">
        <div class="modal-song-title" id="modalSongTitle"></div>
        <div class="modal-singer-text" id="modalSingerText"></div>
        <div class="modal-tag-wrap" id="tagsContainer">
            <span class="modal-tag-item" id="tagLang"></span>
            <span class="modal-tag-item" id="tagGenre"></span>
            <span class="modal-tag-item" id="tagStyle"></span>
        </div>
        <div class="modal-btn-group">
            <button class="modal-action-btn btn-copy-song" id="modalCopyBtn">复制歌名</button>
            <button class="modal-action-btn btn-re-random" id="modalReRandomBtn">重新随机</button>
        </div>
    </div>
</div>
<!-- 气泡容器 -->
<div id="toast-container"></div>

<!-- PC左右并排、文字居中；移动端自动上下 -->
<div class="header">
    <div class="header-avatar-wrap">
        <a href="https://space.bilibili.com/303246676" target="_blank" class="avatar-link">
            <img src="./e22a6dd351d3eb09e7f238e264fd06a2303246676.jpg@560w_560h_1e_1c.avif" alt="头像" class="avatar">
        </a>
    </div>
    <div class="header-text-wrap">
        <h1>栖苑太困辽 与她的</h1>
        <p id="song-count">0 首歌</p>
        <div class="update-info">last update: 2026-09-22</div>
    </div>
    <button class="top-right-btn" onclick="window.open('https://qiyuanyuan.feishu.cn/wiki/ABozwohdai54eWkUhVfc49nLnCe?table=tblAyMnUJgpuWVqp&view=vewXxBNTOK','_blank')">前往路灯</button>
</div>

<!-- B站按钮栏 -->
<div class="user-link-bar">
    <a class="user-link-btn" href="https://space.bilibili.com/303246676" target="_blank">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        个人空间
    </a>
    <a class="user-link-btn live" href="https://live.bilibili.com/10049827" target="_blank">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2"></rect>
        </svg>
        直播间
    </a>
</div>

<!-- PC端一行筛选（大屏显示） -->
<div class="filter-bar">
    <button class="filter-btn active" data-type="lang" data-val="all">全部语言</button>
    <button class="filter-btn" data-type="lang" data-val="中文">中文</button>
    <button class="filter-btn" data-type="lang" data-val="日文">日文</button>
    <button class="filter-btn" data-type="lang" data-val="英文">英文</button>
    <button class="filter-btn active" data-type="style" data-val="all">全部风格</button>
    <button class="filter-btn" data-type="style" data-val="甜歌">甜歌</button>
    <button class="filter-btn" data-type="style" data-val="苦情">苦情</button>
    <button class="filter-btn active" data-type="qufeng" data-val="all">全部曲风</button>
    <button class="filter-btn" data-type="qufeng" data-val="流行">流行</button>
    <button class="filter-btn" data-type="qufeng" data-val="国风">国风</button>
</div>

<!-- 移动端三组分栏（平板/手机显示） -->
<div class="filter-group-mobile">
    <!-- 第一组：语言 -->
    <div class="filter-group">
        <div class="filter-group-buttons">
            <button class="filter-btn active" data-type="lang" data-val="all">全部语言</button>
            <button class="filter-btn" data-type="lang" data-val="中文">中文</button>
            <button class="filter-btn" data-type="lang" data-val="日文">日文</button>
            <button class="filter-btn" data-type="lang" data-val="英文">英文</button>
        </div>
    </div>
    <!-- 第二组：风格 -->
    <div class="filter-group">
        <div class="filter-group-buttons">
            <button class="filter-btn active" data-type="style" data-val="all">全部风格</button>
            <button class="filter-btn" data-type="style" data-val="甜歌">甜歌</button>
            <button class="filter-btn" data-type="style" data-val="苦情">苦情</button>
        </div>
    </div>
    <!-- 第三组：曲风 -->
    <div class="filter-group">
        <div class="filter-group-buttons">
            <button class="filter-btn active" data-type="qufeng" data-val="all">全部曲风</button>
            <button class="filter-btn" data-type="qufeng" data-val="流行">流行</button>
            <button class="filter-btn" data-type="qufeng" data-val="国风">国风</button>
        </div>
    </div>
</div>

<!-- 搜索 -->
<div class="search-bar">
    <button class="shuffle-btn">打乱顺序</button>
    <input class="search-input" placeholder="搜索歌名/歌手">
    <button class="random-btn">随机一首</button>
</div>
<!-- 歌单列表 -->
 <div class="list-container">
    <div class="song-list-wrap" id="list"></div>
</div>
<script src="./app.js?v=7"></script>
</body>
</html>
