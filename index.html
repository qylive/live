<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>栖苑歌单</title>
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
<!-- 随机歌曲弹窗 -->
<div class="random-modal-mask" id="randomModal">
    <div class="random-modal-box">
        <div class="modal-song-title" id="modalSongTitle"></div>
        <div class="modal-singer-text" id="modalSingerText"></div>
        <div class="modal-tag-wrap" id="tagsContainer">
            <span class="modal-tag-item" id="tagLang"></span>
            <span class="modal-tag-item" id="tagGenre"></span>
            <span class="modal-tag-item" id="tagStyle"></span>
        </div>
        <div class="modal-btn-group">
            <button class="modal-action-btn btn-copy-song" id="modalCopyBtn">复制歌名</button>
            <button class="modal-action-btn btn-re-random" id="modalReRandomBtn">重新随机</button>
        </div>
    </div>
</div>
<!-- 右上角按钮 -->
<button class="top-right-btn" onclick="window.open('https://qiyuanyuan.feishu.cn/wiki/ABozwohdai54eWkUhVfc49nLnCe?table=tblAyMnUJgpuWVqp&view=vewXxBNTOK','_blank')">前往路灯</button>
<!-- 气泡容器 -->
<div id="toast-container"></div>

<!-- PC左右并排、文字居中；移动端自动上下 -->
<div class="header">
    <div class="header-avatar-wrap">
        <a href="https://space.bilibili.com/303246676" target="_blank" class="avatar-link">
            <img src="./e22a6dd351d3eb09e7f238e264fd06a2303246676.jpg@560w_560h_1e_1c.avif" alt="头像" class="avatar">
        </a>
    </div>
    <div class="header-text-wrap">
        <h1>栖苑太困辽 与她的</h1>
        <p id="song-count">0 首歌</p>
        <div class="update-info">last update: 2026-06-22</div>
    </div>
</div>

<!-- B站按钮栏 -->
<div class="user-link-bar">
    <a class="user-link-btn" href="https://space.bilibili.com/303246676" target="_blank">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        个人空间
    </a>
    <a class="user-link-btn live" href="https://live.bilibili.com/10049827" target="_blank">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2"></rect>
        </svg>
        直播间
    </a>
</div>

<!-- PC端一行筛选（大屏显示） -->
<div class="filter-bar">
    <button class="filter-btn active" data-type="lang" data-val="all">全部语言</button>
    <button class="filter-btn" data-type="lang" data-val="中文">中文</button>
    <button class="filter-btn" data-type="lang" data-val="日文">日文</button>
    <button class="filter-btn" data-type="lang" data-val="英文">英文</button>
    <button class="filter-btn active" data-type="style" data-val="all">全部风格</button>
    <button class="filter-btn" data-type="style" data-val="甜歌">甜歌</button>
    <button class="filter-btn" data-type="style" data-val="苦情">苦情</button>
    <button class="filter-btn active" data-type="qufeng" data-val="all">全部曲风</button>
    <button class="filter-btn" data-type="qufeng" data-val="流行">流行</button>
    <button class="filter-btn" data-type="qufeng" data-val="国风">国风</button>
</div>

<!-- 移动端三组分栏（平板/手机显示） -->
<div class="filter-group-mobile">
    <!-- 第一组：语言 -->
    <div class="filter-group">
        <div class="filter-group-buttons">
            <button class="filter-btn active" data-type="lang" data-val="all">全部语言</button>
            <button class="filter-btn" data-type="lang" data-val="中文">中文</button>
            <button class="filter-btn" data-type="lang" data-val="日文">日文</button>
            <button class="filter-btn" data-type="lang" data-val="英文">英文</button>
        </div>
    </div>
    <!-- 第二组：风格 -->
    <div class="filter-group">
        <div class="filter-group-buttons">
            <button class="filter-btn active" data-type="style" data-val="all">全部风格</button>
            <button class="filter-btn" data-type="style" data-val="甜歌">甜歌</button>
            <button class="filter-btn" data-type="style" data-val="苦情">苦情</button>
        </div>
    </div>
    <!-- 第三组：曲风 -->
    <div class="filter-group">
        <div class="filter-group-buttons">
            <button class="filter-btn active" data-type="qufeng" data-val="all">全部曲风</button>
            <button class="filter-btn" data-type="qufeng" data-val="流行">流行</button>
            <button class="filter-btn" data-type="qufeng" data-val="国风">国风</button>
        </div>
    </div>
</div>

<!-- 搜索 -->
<div class="search-bar">
    <button class="shuffle-btn">打乱顺序</button>
    <input class="search-input" placeholder="搜索歌名/歌手">
    <button class="random-btn">随机一首</button>
</div>
<!-- 歌单列表 -->
 <div class="list-container">
    <div class="song-list-wrap" id="list"></div>
</div>
<script src="./app.js?v=1"></script>
</body>
</html>
